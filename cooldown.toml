[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "15 days"

[registries.thruput]
min-publish-age = "0"

[[allow.exact]]
crate = "rustls"
version = "0.23.46"

# Security fixes for RUSTSEC-2026-0382 and RUSTSEC-2026-0383.
[[allow.exact]]
crate = "rustls-webpki"
version = "0.103.16"

[[allow.exact]]
crate = "webpki-root-certs"
version = "1.0.10"
