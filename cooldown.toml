# Config for `cargo cooldown`.
# Keep in sync with .cargo/cooldown.toml, .cargo/cooldown-allowlist.toml, and
# the cooldown settings in .github/dependabot.yml.

[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "ignore"

[registry]
global-min-publish-age = "8 days"

# Exceptions for specific releases, such as an urgent security fix, go here as
# [[allow.exact]] entries (crate, version) with a comment giving the reason.

# Exemptions for first-party (thruput-*) crates.
[[allow.package]]
crates = [
    # from thruputchain/xdrs
    "thruput-xdrs",
    "thruput-xdr-common",
    "thruput-xdr-derive",
    "thruput-xdr-repr",
    "thruput-rpc-api",
    "thruput-rpc-driver",

    # from thruputchain/thruput-protocol-rs
    "thruput-syscall",
    "thruput-xdr-macros",
    "thruput-xdr",
    "thruput-spec",
    "thruput-trace",
    "thruput-scp",
    "thruput-node-types",
    "thruput-node-rpc",
    "thruput-coordinator",
    "thruput-indexer",
    "thruput-db-gateway",
    "thruput-view",

    # from thruputchain/thruput-sdk-rs
    "thruput-event",
    "thruput-exn",
    "thruput-storage-cost",
    "thruput-contract-util",
    "thruput-contract-spec",
    "thruput-sys",
    "thruput-macros",
    "thruput-domain-separator",
    "thruput-native-exec",
    "thruput-u256",
    "thruput-test-vectors",
    "thruput-rv32-runtime",
    "thruput-sdk",
    "thruput-spec-tool",
    "thruput-erc20-test",
    "thruput-erc20-native-test",
    "thruput-erc20-if",
    "thruput-erc20-metadata-if",
    "thruput-erc20-controls-if",
    "thruput-erc20-pausable-if",
    "thruput-signed-op-if",
    "thruput-signed-op",
    "thruput-erc20-permit-if",
    "thruput-erc165-if",
    "thruput-erc721-if",
    "thruput-sep41",
    "thruput-access-control-if",
    "thruput-access-control",
]
min-publish-age = "0"
