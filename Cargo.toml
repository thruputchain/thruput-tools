[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/gateway",
    "crates/client",
    "crates/signing",
    "crates/tx-builder",
]

[workspace.dependencies]
# --- Groundhog (private registry) ---
groundhog-xdr = { version = "0.7.7", registry = "groundhog", features = ["serde", "xdrs"] }
groundhog_indexer = { version = "0.7.7", registry = "groundhog" }
groundhog_scheduler = { version = "0.7.7", registry = "groundhog" }
xdrs = { version = "0.5.3", registry = "groundhog", features = ["alloc"] }
xdr-common = { version = "0.5.3", registry = "groundhog" }
rpc_driver = { version = "0.8", registry = "groundhog" }

# --- Async ---
async-trait = "0.1"

# --- JSON-RPC ---
jsonrpsee = { version = "0.25", features = ["server", "client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
hex = "0.4"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# --- CLI / Config ---
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# --- Crypto ---
sha2 = "0.10"

# --- Crypto ---
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
