[workspace]
resolver = "2"
members = [
    "crates/build-info",
    "crates/client",
    "crates/bundle-identity",
    "crates/json-rpc/json-rpc-types",
    "crates/json-rpc/json-rpc-api",
    "crates/json-rpc/json-rpc-server",
    "crates/json-rpc/json-rpc-gateway",
    "crates/json-rpc/json-rpc-client",
    "crates/json-rpc/open-rpc",
    "crates/json-rpc/open-rpc-macros",
    "crates/json-rpc/open-rpc-spec",
    "crates/x23/x23-transport",
    "crates/x23/hogd-backend",
    "crates/tools/agent-knowledge",
    "crates/tools/toolchain",
    "crates/tools/cli",
    "crates/tools/cli-macros",
    "crates/tools/signing",
    "crates/tools/tx-validation",
    "crates/rv32/artifact",
    "crates/rv32/lower",
    "crates/dev/node-supervisor",
    "crates/faucet",
    "crates/dev/e2e-tests",
    "crates/dev/bench",
    "crates/dev/sim",
    "crates/dev/testkit",
]

[workspace.package]
version = "0.19.0-pre.1"
edition = "2024"
# Keep in step with rust-toolchain.toml. Without this, `cargo install
# groundhog-cli` on an older stable fails deep in dependency resolution with
# one "<crate> requires rustc 1.96" line per crate instead of naming this
# package's requirement up front.
rust-version = "1.96"
authors = ["Stellar Development Foundation"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-rpc"
homepage = "https://github.com/groundhogchain/groundhog-rpc"
keywords = ["groundhog"]
categories = ["development-tools"]

[workspace.dependencies]
reqwest = "0.12"
fs2 = "0.4"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
# --- Workspace crates ---
# The version must be duplicated here despite workspace.package.version
# above.  Cargo requires explicit versions for dependencies when
# publishing, as path specifications are stripped out.  Remember to
# keep this in sync.
groundhog-client = { path = "crates/client", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-build-info = { path = "crates/build-info", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-bundle-identity = { path = "crates/bundle-identity", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-json-rpc-types = { path = "crates/json-rpc/json-rpc-types", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-json-rpc-api = { path = "crates/json-rpc/json-rpc-api", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-json-rpc-server = { path = "crates/json-rpc/json-rpc-server", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-json-rpc-client = { path = "crates/json-rpc/json-rpc-client", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-open-rpc = { path = "crates/json-rpc/open-rpc", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-open-rpc-macros = { path = "crates/json-rpc/open-rpc-macros", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-x23-transport = { path = "crates/x23/x23-transport", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-hogd-backend = { path = "crates/x23/hogd-backend", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-signing = { path = "crates/tools/signing", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-tx-validation = { path = "crates/tools/tx-validation", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-node-supervisor = { path = "crates/dev/node-supervisor", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-rv32-artifact = { path = "crates/rv32/artifact", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-rv32-lower = { path = "crates/rv32/lower", version = "=0.19.0-pre.1", registry = "groundhog" }

groundhog-toolchain = { path = "crates/tools/toolchain", version = "=0.19.0-pre.1", registry = "groundhog" }
groundhog-cli-macros = { path = "crates/tools/cli-macros", version = "=0.19.0-pre.1", registry = "groundhog" }

# --- Groundhog (private registry) ---
# These crates define or encode the protocol schema. Keep them exact and update
# them as one qualified release family so published binaries cannot float to an
# incompatible patch release.
groundhog-xdr = { version = "=0.42.0", registry = "groundhog", features = ["serde", "xdrs", "schema"] }
groundhog_indexer = { version = "=0.42.0", registry = "groundhog", features = ["serde"] }
groundhog_scheduler = { version = "=0.42.0", registry = "groundhog" }
groundhog_db_gateway = { version = "=0.42.0", registry = "groundhog" }
groundhog_view = { version = "=0.42.0", registry = "groundhog" }
groundhog_scp = { version = "=0.42.0", registry = "groundhog" }
groundhog_coordinator = { version = "=0.42.0", registry = "groundhog" }
groundhog-trace = { version = "=0.42.0", registry = "groundhog" }
xdrs = { version = "=0.10.1", registry = "groundhog", features = ["alloc"] }
xdr-common = { version = "=0.10.1", registry = "groundhog" }
rpc_driver = { version = "=0.13.1", registry = "groundhog" }
# from the sdk crate:
groundhog-spec-tool = { version = "=0.40.0", registry = "groundhog" }
groundhog-contract-util = { version = "=0.40.0", registry = "groundhog" }
groundhog-domain-separator = { version = "=0.40.0", registry = "groundhog" }
groundhog-contract-spec = { version = "=0.40.0", registry = "groundhog" }
groundhog-u256 = { version = "=0.40.0", registry = "groundhog" }
groundhog-erc20-if = { version = "=0.1.40", registry = "groundhog" }
sdk = { version = "=0.40.0", registry = "groundhog" }

# --- Async ---
async-trait = "0.1"
futures-util = "0.3"
aws-config = { version = "1.9.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.2.0", features = ["test-util"] }
aws-smithy-types = "1.6.1"

# --- JSON-RPC ---
jsonrpsee = { version = "0.25", features = ["server", "client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"

# --- Serialization ---
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["process"] }
insta = "1"
serial_test = "4"
tempfile = "3"
same-file = "1"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.14", default-features = false }
time = { version = "0.3", features = ["formatting"] }

# --- CLI / Config ---
clap = { version = "4", features = ["derive", "string"] }
toml = "0.8"
unicode-width = "0.2"

# --- Crypto ---
sha2 = "0.10"
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"
stellar-strkey = "=0.0.18"
rpassword = "7.4"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
