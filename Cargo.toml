[workspace]
resolver = "2"
members = [
    "crates/json-rpc/json-rpc-types",
    "crates/json-rpc/json-rpc-api",
    "crates/json-rpc/json-rpc-server",
    "crates/json-rpc/json-rpc-gateway",
    "crates/json-rpc/json-rpc-client",
    "crates/json-rpc/open-rpc",
    "crates/json-rpc/open-rpc-macros",
    "crates/json-rpc/open-rpc-spec",
    "crates/x23/x23-transport",
    "crates/tools/signing",
    "crates/tools/cli",
    "crates/rv32/artifact",
    "crates/rv32/lower",
    "crates/dev/node-supervisor",
    "crates/faucet",
    "crates/dev/e2e-tests",
    "crates/dev/bench",
    "crates/dev/sim",
]

[workspace.package]
version = "0.5.19"
edition = "2024"
authors = ["Stellar Development Foundation"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-rpc"
homepage = "https://github.com/groundhogchain/groundhog-rpc"
keywords = ["groundhog"]
categories = ["development-tools"]

[workspace.dependencies]
# --- Workspace crates ---
# The version must be duplicated here despite workspace.package.version
# above.  Cargo requires explicit versions for dependencies when
# publishing, as path specifications are stripped out.  Remember to
# keep this in sync.
groundhog-json-rpc-types = { path = "crates/json-rpc/json-rpc-types", version = "=0.5.19", registry = "groundhog" }
groundhog-json-rpc-api = { path = "crates/json-rpc/json-rpc-api", version = "=0.5.19", registry = "groundhog" }
groundhog-json-rpc-server = { path = "crates/json-rpc/json-rpc-server", version = "=0.5.19", registry = "groundhog" }
groundhog-json-rpc-client = { path = "crates/json-rpc/json-rpc-client", version = "=0.5.19", registry = "groundhog" }
groundhog-open-rpc = { path = "crates/json-rpc/open-rpc", version = "=0.5.19", registry = "groundhog" }
groundhog-open-rpc-macros = { path = "crates/json-rpc/open-rpc-macros", version = "=0.5.19", registry = "groundhog" }
groundhog-x23-transport = { path = "crates/x23/x23-transport", version = "=0.5.19", registry = "groundhog" }
groundhog-signing = { path = "crates/tools/signing", version = "=0.5.19", registry = "groundhog" }
groundhog-node-supervisor = { path = "crates/dev/node-supervisor", version = "=0.5.19", registry = "groundhog" }
groundhog-rv32-artifact = { path = "crates/rv32/artifact", version = "=0.5.19", registry = "groundhog" }
groundhog-rv32-lower = { path = "crates/rv32/lower", version = "=0.5.19", registry = "groundhog" }

# --- Groundhog (private registry) ---
groundhog-xdr = { version = "0.19.8", registry = "groundhog", features = ["serde", "xdrs", "schema"] }
groundhog_indexer = { version = "0.19.8", registry = "groundhog", features = ["serde"] }
groundhog_scheduler = { version = "0.19.8", registry = "groundhog" }
groundhog_db_gateway = { version = "0.19.8", registry = "groundhog" }
groundhog_view = { version = "0.19.8", registry = "groundhog" }
groundhog_scp = { version = "0.19.8", registry = "groundhog" }
groundhog_coordinator = { version = "0.19.8", registry = "groundhog" }
groundhog-trace = { version = "0.19.8", registry = "groundhog" }
xdrs = { version = "0.8.0", registry = "groundhog", features = ["alloc"] }
xdr-common = { version = "0.8.0", registry = "groundhog" }
rpc_driver = { version = "0.9", registry = "groundhog" }
groundhog-wasm-meter = { version = "0.8.0", registry = "groundhog" }
# from the sdk crate:
groundhog-spec-tool = { version = "0.17.2", registry = "groundhog" }
groundhog-contract-util = { version = "0.17.2", registry = "groundhog" }
groundhog-contract-spec = { version = "0.17.2", registry = "groundhog" }

# --- Async ---
async-trait = "0.1"
aws-config = { version = "1.9.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = "1.109.0"

# --- JSON-RPC ---
jsonrpsee = { version = "0.25", features = ["server", "client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"

# --- Serialization ---
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["process"] }
insta = "1"
serial_test = "3"
tempfile = "3"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
time = { version = "0.3", features = ["formatting"] }

# --- CLI / Config ---
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# --- Crypto ---
sha2 = "0.10"
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
