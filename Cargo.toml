[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/rpc-api",
    "crates/gateway",
    "crates/client",
    "crates/signing",
    "crates/tx-builder",
    "crates/cli",
    "crates/dev-node",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-rpc"
homepage = "https://github.com/groundhogchain/groundhog-rpc"
keywords = ["groundhog"]
categories = ["development-tools"]

[workspace.dependencies]
# --- Workspace crates ---
# The version must be duplicated here despite workspace.package.version
# above.  Cargo requires explicit versions for dependencies when
# publishing, as path specifications are stripped out.  Remember to
# keep this in sync.
groundhog-rpc-api-types = { path = "crates/api-types", version = "=0.2.1", registry = "groundhog" }
groundhog-rpc-api = { path = "crates/rpc-api", version = "=0.2.1", registry = "groundhog" }
groundhog-rpc-client = { path = "crates/client", version = "=0.2.1", registry = "groundhog" }
groundhog-signing = { path = "crates/signing", version = "=0.2.1", registry = "groundhog" }
groundhog-dev-node = { path = "crates/dev-node", version = "=0.2.1", registry = "groundhog" }

# --- Groundhog (private registry) ---
groundhog-xdr = { version = "0.7.9", registry = "groundhog", features = ["serde", "xdrs"] }
groundhog_indexer = { version = "0.7.9", registry = "groundhog" }
groundhog_scheduler = { version = "0.7.9", registry = "groundhog" }
xdrs = { version = "0.5.3", registry = "groundhog", features = ["alloc"] }
xdr-common = { version = "0.5.3", registry = "groundhog" }
rpc_driver = { version = "0.8", registry = "groundhog" }
groundhog-native-exec = { version = "0.11.2", registry = "groundhog" }

# --- Async ---
async-trait = "0.1"

# --- JSON-RPC ---
jsonrpsee = { version = "0.25", features = ["server", "client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
hex = "0.4"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# --- CLI / Config ---
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# --- Crypto ---
sha2 = "0.10"
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
