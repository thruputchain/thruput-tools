[workspace]
resolver = "2"
members = [
    "crates/build-info",
    "crates/client",
    "crates/bundle-identity",
    "crates/json-rpc/json-rpc-types",
    "crates/json-rpc/json-rpc-api",
    "crates/json-rpc/json-rpc-server",
    "crates/json-rpc/json-rpc-gateway",
    "crates/json-rpc/json-rpc-client",
    "crates/json-rpc/open-rpc",
    "crates/json-rpc/open-rpc-macros",
    "crates/json-rpc/open-rpc-spec",
    "crates/x23/x23-transport",
    "crates/x23/hogd-backend",
    "crates/agent-knowledge",
    "crates/toolchain",
    "crates/cli",
    "crates/cli-macros",
    "crates/signing",
    "crates/tx-validation",
    "crates/rv32/artifact",
    "crates/rv32/lower",
    "crates/node-supervisor",
    "crates/faucet",
    "crates/firehose",
    "crates/e2e-tests",
    "crates/bench",
    "crates/sim",
    "crates/testkit",
]

[workspace.package]
version = "0.24.0"
edition = "2024"
# Keep in step with rust-toolchain.toml. Without this, `cargo install
# groundhog-cli` on an older stable fails deep in dependency resolution with
# one "<crate> requires rustc 1.96" line per crate instead of naming this
# package's requirement up front.
rust-version = "1.96"
authors = ["Stellar Development Foundation"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-rpc"
homepage = "https://github.com/groundhogchain/groundhog-rpc"
keywords = ["groundhog"]
categories = ["development-tools"]

[workspace.dependencies]
reqwest = "0.12"
fs2 = "0.4"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zstd = "0.13"
# --- Workspace crates ---
# The version must be duplicated here despite workspace.package.version
# above.  Cargo requires explicit versions for dependencies when
# publishing, as path specifications are stripped out.  Remember to
# keep this in sync.
groundhog-client = { path = "crates/client", version = "=0.24.0", registry = "groundhog" }
groundhog-build-info = { path = "crates/build-info", version = "=0.24.0", registry = "groundhog" }
groundhog-bundle-identity = { path = "crates/bundle-identity", version = "=0.24.0", registry = "groundhog" }
groundhog-json-rpc-types = { path = "crates/json-rpc/json-rpc-types", version = "=0.24.0", registry = "groundhog" }
groundhog-json-rpc-api = { path = "crates/json-rpc/json-rpc-api", version = "=0.24.0", registry = "groundhog" }
groundhog-json-rpc-server = { path = "crates/json-rpc/json-rpc-server", version = "=0.24.0", registry = "groundhog" }
groundhog-json-rpc-client = { path = "crates/json-rpc/json-rpc-client", version = "=0.24.0", registry = "groundhog" }
groundhog-open-rpc = { path = "crates/json-rpc/open-rpc", version = "=0.24.0", registry = "groundhog" }
groundhog-open-rpc-macros = { path = "crates/json-rpc/open-rpc-macros", version = "=0.24.0", registry = "groundhog" }
groundhog-x23-transport = { path = "crates/x23/x23-transport", version = "=0.24.0", registry = "groundhog" }
groundhog-hogd-backend = { path = "crates/x23/hogd-backend", version = "=0.24.0", registry = "groundhog" }
groundhog-signing = { path = "crates/signing", version = "=0.24.0", registry = "groundhog" }
groundhog-tx-validation = { path = "crates/tx-validation", version = "=0.24.0", registry = "groundhog" }
groundhog-node-supervisor = { path = "crates/node-supervisor", version = "=0.24.0", registry = "groundhog" }
groundhog-rv32-artifact = { path = "crates/rv32/artifact", version = "=0.24.0", registry = "groundhog" }
groundhog-rv32-lower = { path = "crates/rv32/lower", version = "=0.24.0", registry = "groundhog" }

groundhog-toolchain = { path = "crates/toolchain", version = "=0.24.0", registry = "groundhog" }
groundhog-cli-macros = { path = "crates/cli-macros", version = "=0.24.0", registry = "groundhog" }

# --- Groundhog (private registry) ---
# These crates define or encode the protocol schema. Keep them exact and update
# them as one qualified release family so published binaries cannot float to an
# incompatible patch release.
groundhog-xdr = { version = "=0.46.0", registry = "groundhog", features = ["serde", "xdrs", "schema"] }
groundhog_indexer = { version = "=0.46.0", registry = "groundhog", features = ["serde"] }
groundhog_scheduler = { version = "=0.46.0", registry = "groundhog" }
groundhog_db_gateway = { version = "=0.46.0", registry = "groundhog" }
groundhog_view = { version = "=0.46.0", registry = "groundhog" }
groundhog_scp = { version = "=0.46.0", registry = "groundhog" }
groundhog_coordinator = { version = "=0.46.0", registry = "groundhog" }
groundhog-trace = { version = "=0.46.0", registry = "groundhog" }
# The XDR codec is the exception: caret, so an xdrs patch release reaches this
# workspace without a release here.  Cargo still resolves one 0.10.x per graph.
xdrs = { version = "0.10.3", registry = "groundhog", features = ["alloc"] }
xdr-common = { version = "0.10.3", registry = "groundhog" }
rpc_driver = { version = "=0.13.1", registry = "groundhog" }
# from the sdk crate:
groundhog-spec-tool = { version = "=0.44.2", registry = "groundhog" }
groundhog-contract-util = { version = "=0.44.2", registry = "groundhog" }
groundhog-domain-separator = { version = "=0.44.2", registry = "groundhog" }
groundhog-contract-spec = { version = "=0.44.2", registry = "groundhog" }
groundhog-u256 = { version = "=0.44.2", registry = "groundhog" }
groundhog-erc20-if = { version = "=0.1.47", registry = "groundhog" }
groundhog-erc20-permit-if = { version = "=0.1.47", registry = "groundhog" }
sdk = { version = "=0.44.2", registry = "groundhog" }

# --- Async ---
async-trait = "0.1"
futures-util = "0.3"
aws-config = { version = "1.9.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.2.0", features = ["test-util"] }
aws-smithy-types = "1.6.1"

# --- JSON-RPC ---
# Only the HTTP client is used; "client" would also pull the WebSocket and wasm
# clients (soketto, gloo-net, web-sys and friends) into every build.
jsonrpsee = { version = "0.25", features = ["server", "http-client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"
http-body-util = "0.1"

# --- Serialization ---
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
hex = "0.4"
base64 = "0.22"
semver = "1"
libc = "0.2"
# getrandom 0.2 stays in the graph through ring and soketto; keep our own calls on
# the current line so nothing here holds the old one once those move.
getrandom = "0.4"
signal-hook = "0.3"
nix = { version = "0.30", default-features = false, features = ["process"] }

# --- Test support ---
insta = "1"
serial_test = "4"
tempfile = "3"
same-file = "1"
pretty_assertions = "1"
vt100 = "0.16"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.14", default-features = false }
time = { version = "0.3", features = ["formatting"] }
hdrhistogram = "7"

# --- CLI / Config ---
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4.5.66"
# toml and toml_edit must share a release line: proc-macro-crate (via jsonrpsee
# and open-rpc-macros) is on toml_edit 0.25, so staying on toml 0.8 duplicated
# toml_edit, toml_datetime and winnow.
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"
which = "7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std", "layout-cache", "unstable-rendered-line-info"] }

# --- Proc macros ---
syn = { version = "2", features = ["full", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# --- Crypto ---
# 0.11 selects the aarch64 and x86 SHA-256 hardware backends at runtime through
# cpufeatures, so the 0.10 "asm" feature (and its sha2-asm C build) is no longer
# needed to get sha256h on ARM; see `make check-native`. 0.11 is also the line the
# groundhog registry crates and aws-sigv4 use.
sha2 = "0.11"
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
zeroize = "1"
stellar-strkey = "=0.0.18"
rpassword = "7.4"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
debug = "line-tables-only"
