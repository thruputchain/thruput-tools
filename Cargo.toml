[workspace]
resolver = "2"
members = [
    "crates/encoding",
    "crates/heap-profiling",
    "crates/build-info",
    "crates/client",
    "crates/bundle-identity",
    "crates/json-rpc/json-rpc-types",
    "crates/json-rpc/json-rpc-api",
    "crates/json-rpc/json-rpc-server",
    "crates/json-rpc/json-rpc-gateway",
    "crates/json-rpc/json-rpc-client",
    "crates/json-rpc/open-rpc",
    "crates/json-rpc/open-rpc-macros",
    "crates/json-rpc/open-rpc-spec",
    "crates/x23/x23-transport",
    "crates/x23/hogd-backend",
    "crates/toolchain",
    "crates/cli",
    "crates/cli-macros",
    "crates/signing",
    "crates/tx-validation",
    "crates/rv32/artifact",
    "crates/rv32/lower",
    "crates/node-supervisor",
    "crates/faucet",
    "crates/firehose",
    "crates/bench",
    "crates/testkit",
]
# Builds the same `thruput` binary as crates/cli; see its Cargo.toml.
exclude = ["crates/thruput"]

[workspace.package]
version = "0.40.2"
edition = "2024"
# Keep in step with rust-toolchain.toml. Without this, `cargo install
# thruput-cli` on an older stable fails deep in dependency resolution with
# one "<crate> requires rustc 1.96" line per crate instead of naming this
# package's requirement up front.
rust-version = "1.96"
authors = ["Stellar Development Foundation"]
license = "Apache-2.0"
publish = ["thruput"]
repository = "https://github.com/thruputchain/thruput-tools"
homepage = "https://github.com/thruputchain/thruput-tools"
keywords = ["thruput"]
categories = ["development-tools"]

[workspace.dependencies]
shlex = "2"
reqwest = "0.12"
fs2 = "0.4"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zstd = "0.14.3"
# --- Workspace crates ---
# The version must be duplicated here despite workspace.package.version
# above.  Cargo requires explicit versions for dependencies when
# publishing, as path specifications are stripped out.  Remember to
# keep this in sync.
thruput-encoding = { path = "crates/encoding", version = "=0.40.2", registry = "thruput" }
thruput-client = { path = "crates/client", version = "=0.40.2", registry = "thruput" }
thruput-build-info = { path = "crates/build-info", version = "=0.40.2", registry = "thruput" }
thruput-bundle-identity = { path = "crates/bundle-identity", version = "=0.40.2", registry = "thruput" }
thruput-json-rpc-types = { path = "crates/json-rpc/json-rpc-types", version = "=0.40.2", registry = "thruput" }
thruput-json-rpc-api = { path = "crates/json-rpc/json-rpc-api", version = "=0.40.2", registry = "thruput" }
thruput-json-rpc-server = { path = "crates/json-rpc/json-rpc-server", version = "=0.40.2", registry = "thruput" }
thruput-json-rpc-client = { path = "crates/json-rpc/json-rpc-client", version = "=0.40.2", registry = "thruput" }
thruput-open-rpc = { path = "crates/json-rpc/open-rpc", version = "=0.40.2", registry = "thruput" }
thruput-open-rpc-macros = { path = "crates/json-rpc/open-rpc-macros", version = "=0.40.2", registry = "thruput" }
thruput-x23-transport = { path = "crates/x23/x23-transport", version = "=0.40.2", registry = "thruput" }
thruput-hogd-backend = { path = "crates/x23/hogd-backend", version = "=0.40.2", registry = "thruput" }
thruput-heap-profiling = { path = "crates/heap-profiling", version = "=0.40.2" }
thruput-signing = { path = "crates/signing", version = "=0.40.2", registry = "thruput" }
thruput-tx-validation = { path = "crates/tx-validation", version = "=0.40.2", registry = "thruput" }
thruput-node-supervisor = { path = "crates/node-supervisor", version = "=0.40.2", registry = "thruput" }
thruput-rv32-artifact = { path = "crates/rv32/artifact", version = "=0.40.2", registry = "thruput" }
thruput-rv32-lower = { path = "crates/rv32/lower", version = "=0.40.2", registry = "thruput" }

thruput-toolchain = { path = "crates/toolchain", version = "=0.40.2", registry = "thruput" }
thruput-cli-macros = { path = "crates/cli-macros", version = "=0.40.2", registry = "thruput" }

# --- Thruput (private registry) ---
# These crates define or encode the protocol schema. Keep them exact and update
# them as one qualified release family so published binaries cannot float to an
# incompatible patch release.
thruput-xdr = { version = "=0.61.0", registry = "thruput", features = ["serde", "xdrs", "schema"] }
thruput-indexer = { version = "=0.61.0", registry = "thruput", features = ["serde"] }
thruput-scheduler = { version = "=0.61.0", registry = "thruput" }
thruput-db-gateway = { version = "=0.61.0", registry = "thruput" }
thruput-view = { version = "=0.61.0", registry = "thruput" }
thruput-scp = { version = "=0.61.0", registry = "thruput" }
thruput-trace = { version = "=0.61.0", registry = "thruput" }
# from the sdk crate:
thruput-spec-tool = { version = "=0.57.1", registry = "thruput" }
thruput-contract-util = { version = "=0.57.1", registry = "thruput" }
thruput-domain-separator = { version = "=0.57.1", registry = "thruput" }
thruput-contract-spec = { version = "=0.57.1", registry = "thruput" }
thruput-u256 = { version = "=0.57.1", registry = "thruput" }
thruput-erc20-if = { version = "=0.1.69", registry = "thruput" }
thruput-erc20-permit-if = { version = "=0.1.69", registry = "thruput" }
thruput-sdk = { version = "=0.57.1", registry = "thruput" }

# --- xdrs (crates.io, published as thruput-*) ---
# The XDR codec is the exception: caret, so an xdrs patch release reaches this
# workspace without a release here. Cargo resolves the protocol's 0.16.x codec.
xdrs = { package = "thruput-xdrs", version = "0.17.1", features = ["alloc"] }
xdr-common = { package = "thruput-xdr-common", version = "0.17.1" }
rpc_driver = { package = "thruput-rpc-driver", version = "=0.17.1" }

# --- Async ---
async-trait = "0.1"
futures-util = "0.3"
aws-config = { version = "1.9.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.2.0", features = ["test-util"] }
aws-smithy-types = "1.6.1"

# --- JSON-RPC ---
# Only the HTTP client is used; "client" would also pull the WebSocket and wasm
# clients (soketto, gloo-net, web-sys and friends) into every build.
jsonrpsee = { version = "0.25", features = ["server", "http-client", "macros"] }
jsonrpsee-types = "0.25"

# --- HTTP / Async ---
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = "1"
http-body-util = "0.1"

# --- Serialization ---
schemars = "1"
# `rc` lets a response type hold an `Arc<T>` payload, so a server can answer
# from a reading it already holds without copying it.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
bytes = "1"
hex = "0.4"
base64 = "0.22"
semver = "1"
libc = "0.2"
# getrandom 0.2 stays in the graph through ring and soketto; keep our own calls on
# the current line so nothing here holds the old one once those move.
getrandom = "0.4"
signal-hook = "0.3"
nix = { version = "0.30", default-features = false, features = ["process"] }

# --- Test support ---
insta = "1"
jsonschema = { version = "0.59", default-features = false }
serial_test = "4"
tempfile = "3"
same-file = "1"
pretty_assertions = "1"
vt100 = "0.16"

# --- Observability ---
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-sys = { version = "0.7", features = ["profiling"] }
backtrace = "0.3"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "tls-ring", "tls-roots"] }
prometheus = { version = "0.14", default-features = false }
time = { version = "0.3", features = ["formatting"] }
hdrhistogram = "7"

# --- CLI / Config ---
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4.5.66"
# toml and toml_edit must share a release line: proc-macro-crate (via jsonrpsee
# and open-rpc-macros) is on toml_edit 0.25, so staying on toml 0.8 duplicated
# toml_edit, toml_datetime and winnow.
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"
which = "7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std", "layout-cache", "unstable-rendered-line-info"] }

# --- Proc macros ---
syn = { version = "2", features = ["full", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# --- Crypto ---
# 0.11 selects the aarch64 and x86 SHA-256 hardware backends at runtime through
# cpufeatures, so the 0.10 "asm" feature (and its sha2-asm C build) is no longer
# needed to get sha256h on ARM; see `make check-native`. 0.11 is also the line the
# groundhog registry crates and aws-sigv4 use.
sha2 = "0.11"
ed25519-compact = { version = "2.2", default-features = false, features = ["opt_size"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
# Pure ML-DSA (FIPS 204). Keys are expanded from the stored 32-byte seed.
ml-dsa = { version = "0.1.1", default-features = false, features = ["zeroize"] }
zeroize = "1"
stellar-strkey = "=0.0.18"
rpassword = "7.4"

# --- Error handling ---
thiserror = "2"

[workspace.lints.rust]
unused-must-use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must-use-candidate = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[profile.release]
overflow-checks = true
debug = "line-tables-only"

# Dev and test builds link 117 integration-test binaries, and by default each
# one carries a full copy of the debuginfo for all ~560 crates it pulls in.
# That debuginfo is most of the target directory. `test` inherits these.
[profile.dev]
# On Linux, leave the DWARF in per-object .dwo files instead of copying it into
# every linked binary. Debuggers and backtraces still find it; macOS already
# defaults to this.
split-debuginfo = "unpacked"

# Dependencies keep file:line for backtraces; only stepping into their source
# in a debugger degrades. Workspace crates keep full debuginfo.
[profile.dev.package."*"]
debug = "line-tables-only"

# Build scripts and proc macros are build-time machinery nobody debugs.
[profile.dev.build-override]
debug = false
