[package]
name = "groundhog-bench"
default-run = "groundhog-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Benchmark harness for Groundhog JSON-RPC endpoints"

[[bin]]
name = "groundhog-bench"
path = "src/main.rs"

[[bin]]
name = "groundhog-lookup-bench"
path = "src/lookup_bench.rs"

[dependencies]
xdrs = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-xdr = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
hdrhistogram = "7"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
