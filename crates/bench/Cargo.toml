[package]
name = "thruput-bench"
default-run = "thruput-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Benchmark harness for Thruput JSON-RPC endpoints"

[[bin]]
name = "thruput-bench"
path = "src/main.rs"

[[bin]]
name = "thruput-lookup-bench"
path = "src/lookup_bench.rs"

[dependencies]
xdrs = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-signing = { workspace = true }
thruput-xdr = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true, features = ["json"] }
hdrhistogram = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
