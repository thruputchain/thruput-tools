[package]
name = "groundhog-e2e-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Process-level JSON-RPC smoke tests for Groundhog"

# This crate exists only for integration tests.
# It does not produce a library.
[lib]
path = "src/lib.rs"

[dependencies]
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-xdr = { workspace = true }
xdr-common = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
jsonrpsee = { workspace = true }
