[package]
name = "thruput-faucet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hosted Devnet faucet for Thruput"

[[bin]]
name = "thruput-faucet"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
thruput-build-info = { workspace = true }
groundhog-heap-profiling = { workspace = true }
thruput-json-rpc-client = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-signing = { workspace = true }
thruput-xdr = { workspace = true }
hex = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
jsonrpsee = { workspace = true }
xdrs = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-smithy-types = { workspace = true }
http = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[features]
# Linux jemalloc allocator plus opt-in heap profiles. Linux release builds enable it.
heap-profiling = ["groundhog-heap-profiling/jemalloc", "dep:tikv-jemallocator"]

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
