# Example local faucet config. Copy to crates/faucet/faucet.toml and replace
# placeholder network identity values with values from your local/devnet setup.
listen_address = "127.0.0.1:8081"
# Static UIs hosted on a different origin must be allowed here.
cors_allowed_origins = ["http://127.0.0.1:5173"]

[network]
network_id = "local-devnet"
protocol = "x23"
genesis_hash = "11111111111111111111111111111111"
# Network hash this faucet signs against, as `hog-devnode` writes it into the
# runtime manifest: unprefixed, case-sensitive base58.
network_hash = "11111111111111111111111111111111"

[network.endpoints]
rpc_url = "http://127.0.0.1:9545"

[network.native_hog]
token_address = "11111111111111111111111111111112"
decimals = 7
transfer_entrypoint = "0x63285b3523f9dc3f"

[network.faucet]
wallet_address = "11111111111111111111111111111111"
public_key = "11111111111111111111111111111111"

[airdrop]
raw_amount = "1000000000"

[airdrop.secret_key_source]
type = "environment"
variable = "GROUNDHOG_FAUCET_SECRET_KEY"

[policy.airdrop]
# Global retained idempotency records; see README Policy State for sizing.
max_retained_attempts = 10000
