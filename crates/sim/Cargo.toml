[package]
name = "groundhog-sim"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "hoglab"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
groundhog-rpc-api-types = { workspace = true }
groundhog-rpc-client = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-xdr = { workspace = true }
hdrhistogram = "7"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
