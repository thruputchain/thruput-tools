[package]
name = "thruput-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Simulation and soak-test harness for Thruput JSON-RPC targets"

[[bin]]
name = "hogsim"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thruput-build-info = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-json-rpc-client = { workspace = true }
thruput-client = { workspace = true }
thruput-contract-util = { workspace = true }
thruput-signing = { workspace = true }
thruput-xdr = { workspace = true }
hdrhistogram = { workspace = true }
hex = { workspace = true }
jsonrpsee = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
xdr-common = { workspace = true }
xdrs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
