[package]
name = "groundhog-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Groundhog smart contract development tools"

exclude = [
    "docs/",
    "tests/",
]

[[bin]]
name = "groundhog"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
groundhog-build-info = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
which = "7"
rpassword = "7"
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap_complete = "4.5.66"
getrandom = "0.2.17"
hex = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
zstd = "0.13"
zeroize = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-rv32-artifact = { workspace = true }
groundhog-rv32-lower = { workspace = true }
groundhog-contract-spec = { workspace = true }
groundhog-erc20-if = { workspace = true }
sdk = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-spec-tool = { workspace = true }
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
groundhog-node-supervisor = { workspace = true }
jsonrpsee = { workspace = true, features = ["client", "http-client"] }
libc = { workspace = true }
tempfile = "3"

[dev-dependencies]
serial_test = { workspace = true }

[lints]
workspace = true
