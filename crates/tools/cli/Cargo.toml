[package]
name = "groundhog-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Groundhog smart contract development tools"

exclude = [
    "assets/groundhog/knowledge/README.md",
    "assets/groundhog/knowledge/bundle.toml",
    "assets/groundhog/knowledge/generated/manifest.json",
    "assets/groundhog/knowledge/generated/agent-guide.md",
    "assets/groundhog/knowledge/generated/records.jsonl",
    "assets/groundhog/knowledge/records/",
    "/docs/",
    "tests/",
]

[[bin]]
name = "groundhog"
path = "src/main.rs"

[dependencies]
groundhog-client = { workspace = true }
clap = { workspace = true }
groundhog-build-info = { workspace = true }
groundhog-bundle-identity = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
toml_edit = "0.22"
which = "7"
reqwest = { workspace = true, features = ["blocking", "json"] }
http-body-util = "0.1"
clap_complete = "4.5.66"
getrandom = "0.2.17"
fs2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
zstd = "0.13"
zeroize = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-rv32-artifact = { workspace = true }
groundhog-rv32-lower = { workspace = true }
groundhog-contract-spec = { workspace = true }
groundhog-erc20-if = { workspace = true }
sdk = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-spec-tool = { workspace = true }
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing-subscriber = { workspace = true }
groundhog-node-supervisor = { workspace = true }
groundhog-toolchain = { workspace = true }
jsonrpsee = { workspace = true, features = ["client", "http-client"] }
libc = { workspace = true }
tempfile = "3"

[dev-dependencies]
serial_test = { workspace = true }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
