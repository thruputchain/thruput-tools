[package]
name = "groundhog-rv32-lower"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lower a RISC-V rv32im contract ELF to a Groundhog v3 RV32 artifact (the wasm-opt analog for rv32)"
# Published to the private `groundhog` registry (inherits the workspace
# allow-list) so hogd can install / shell out to the `rv32-lower` binary and
# sdk_rs can depend on the library. The `artifact` module is still slated to
# split out to a standalone `groundhog-rv32-artifact` crate later.
publish.workspace = true

[[bin]]
name = "rv32-lower"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
