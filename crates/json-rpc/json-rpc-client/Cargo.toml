[package]
name = "groundhog-json-rpc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Typed client for the Groundhog JSON-RPC API"

exclude = [
    "tests/",
]

[lints]
workspace = true

[dependencies]
groundhog-json-rpc-api = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
jsonrpsee = { workspace = true, features = ["client", "macros", "http-client"] }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
groundhog-json-rpc-server = { workspace = true }
groundhog-xdr = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
serde_json = { workspace = true }
xdr-common = { workspace = true }
