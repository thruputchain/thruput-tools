[package]
name = "thruput-json-rpc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Typed client for the Thruput JSON-RPC API"

exclude = [
    "tests/",
]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thruput-json-rpc-api = { workspace = true }
thruput-json-rpc-types = { workspace = true }
jsonrpsee = { workspace = true, features = ["macros", "http-client"] }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
thruput-open-rpc = { workspace = true }
thruput-open-rpc-macros = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
thruput-json-rpc-server = { workspace = true }
thruput-xdr = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
xdr-common = { workspace = true }
