[package]
name = "thruput-json-rpc-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "JSON-RPC gateway server for Thruput"

exclude = [
    "tests/",
]

[[bin]]
name = "hog-gateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
thruput-build-info = { workspace = true }
thruput-bundle-identity = { workspace = true }
groundhog-heap-profiling = { workspace = true }
thruput-hogd-backend = { workspace = true }
thruput-json-rpc-api = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-json-rpc-server = { workspace = true }
thruput-x23-transport = { workspace = true }
thruput-xdr = { workspace = true }
thruput-indexer = { workspace = true }
thruput-scheduler = { workspace = true }
thruput-db-gateway = { workspace = true }
thruput-view = { workspace = true }
thruput-scp = { workspace = true }
rpc_driver = { workspace = true }
xdr-common = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
jsonrpsee = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
thruput-trace = { workspace = true }
thruput-coordinator = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
# Linux jemalloc allocator plus opt-in heap profiles. Off until load numbers qualify it.
heap-profiling = ["groundhog-heap-profiling/jemalloc", "dep:tikv-jemallocator"]

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
