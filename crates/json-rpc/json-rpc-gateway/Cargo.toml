[package]
name = "groundhog-json-rpc-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "JSON-RPC gateway server for Groundhog"

exclude = [
    "tests/",
]

[[bin]]
name = "hog-gateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
groundhog-build-info = { workspace = true }
groundhog-bundle-identity = { workspace = true }
groundhog-json-rpc-api = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-json-rpc-server = { workspace = true }
groundhog-x23-transport = { workspace = true }
groundhog-xdr = { workspace = true }
groundhog_indexer = { workspace = true }
groundhog_scheduler = { workspace = true }
groundhog_db_gateway = { workspace = true }
groundhog_view = { workspace = true }
groundhog_scp = { workspace = true }
rpc_driver = { workspace = true }
xdr-common = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
jsonrpsee = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
groundhog_coordinator = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
