[package]
name = "thruput-json-rpc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Reusable JSON-RPC server layer for Thruput"

[lints]
workspace = true

[dependencies]
thruput-build-info = { workspace = true }
thruput-bundle-identity = { workspace = true }
thruput-json-rpc-api = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-tx-validation = { workspace = true }
thruput-xdr = { workspace = true }
xdr-common = { workspace = true }
xdrs = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jsonrpsee = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# `test-util` is not part of tokio's `full`; it backs the paused clock the
# tip-refresh tests use to assert reuse windows without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
