[package]
name = "thruput-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Thruput smart contract development tools"

# Spelled out rather than inherited: a package `exclude` replaces the
# workspace one.
exclude = ["/fixtures", "/tests"]

[[bin]]
name = "thruput"
path = "src/main.rs"

[dependencies]
thruput-encoding = { workspace = true }
shlex = { workspace = true }
thruput-client = { workspace = true }
clap = { workspace = true }
thruput-build-info = { workspace = true }
thruput-bundle-identity = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
ratatui = { workspace = true }
toml_edit = { workspace = true }
which = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
http-body-util = { workspace = true }
clap_complete = { workspace = true }
getrandom = { workspace = true }
fs2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zstd = { workspace = true }
zeroize = { workspace = true }
rpassword = { workspace = true }
thruput-cli-macros = { workspace = true }
thruput-signing = { workspace = true }
thruput-rv32-artifact = { workspace = true }
thruput-rv32-lower = { workspace = true }
thruput-contract-spec = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-sdk = { workspace = true }
thruput-contract-util = { workspace = true }
thruput-spec-tool = { workspace = true }
thruput-json-rpc-client = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
thruput-node-supervisor = { workspace = true }
thruput-toolchain = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client"] }
libc = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
thruput-json-rpc-api = { workspace = true }
thruput-json-rpc-server = { workspace = true }
thruput-domain-separator = { workspace = true }
pretty_assertions = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
serial_test = { workspace = true }
vt100 = { workspace = true }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
