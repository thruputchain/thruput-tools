[package]
name = "groundhog-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "groundhog"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
which = "7"
rpassword = "7"
clap_complete = "4.5.66"
getrandom = "0.2.17"
hex = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
groundhog-signing = { path = "../signing" }
groundhog-rpc-client = { path = "../client" }
groundhog-rpc-api-types = { path = "../api-types" }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
groundhog-dev-node = { path = "../dev-node", optional = true }
groundhog-sys = { path = "../groundhog-sys", optional = true }

[features]
dev-node = ["dep:groundhog-dev-node", "dep:groundhog-sys"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
