[package]
name = "groundhog-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Groundhog smart contract development tools"

exclude = [
    "docs/",
    "tests/",
]

[[bin]]
name = "groundhog"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
which = "7"
rpassword = "7"
clap_complete = "4.5.66"
getrandom = "0.2.17"
hex = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-wasm-meter = { workspace = true }
groundhog-contract-spec = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-spec-tool = { workspace = true }
groundhog-rpc-client = { workspace = true }
groundhog-rpc-api-types = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
groundhog-node-supervisor = { workspace = true, optional = true }
jsonrpsee = { workspace = true, features = ["client", "http-client"] }

[features]
dev-node = ["dep:groundhog-node-supervisor"]

[dev-dependencies]
libc = { workspace = true }
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
