[package]
name = "groundhog-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Groundhog smart contract development tools"

exclude = [
    "/docs/",
    "tests/",
]

[[bin]]
name = "groundhog"
path = "src/main.rs"

[dependencies]
groundhog-client = { workspace = true }
clap = { workspace = true }
groundhog-build-info = { workspace = true }
groundhog-bundle-identity = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
ratatui = { workspace = true }
toml_edit = { workspace = true }
which = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
http-body-util = { workspace = true }
clap_complete = { workspace = true }
getrandom = { workspace = true }
fs2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zstd = { workspace = true }
zeroize = { workspace = true }
rpassword = { workspace = true }
groundhog-cli-macros = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-rv32-artifact = { workspace = true }
groundhog-rv32-lower = { workspace = true }
groundhog-contract-spec = { workspace = true }
groundhog-erc20-if = { workspace = true }
sdk = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-spec-tool = { workspace = true }
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
groundhog-node-supervisor = { workspace = true }
groundhog-toolchain = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client"] }
libc = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
groundhog-erc20-permit-if = { workspace = true }
serial_test = { workspace = true }
vt100 = { workspace = true }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
