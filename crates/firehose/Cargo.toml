[package]
name = "thruput-firehose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental committed-block archive for Thruput"

[[bin]]
name = "hog-firehose-store"
path = "src/main.rs"

[[bin]]
name = "hog-firehose-serve"
path = "src/serve.rs"

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
fs2.workspace = true
thruput-indexer.workspace = true
thruput-scheduler.workspace = true
thruput-xdr.workspace = true
thruput-x23-transport.workspace = true
thruput-json-rpc-types.workspace = true
jsonrpsee.workspace = true
prometheus.workspace = true
rpc_driver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xdrs.workspace = true

[dev-dependencies]
async-trait.workspace = true
# The subscription tests drive the server over WebSocket; nothing else does.
jsonrpsee = { workspace = true, features = ["ws-client"] }
thruput-signing.workspace = true
hex.workspace = true
tempfile.workspace = true
