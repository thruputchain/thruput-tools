[package]
name = "thruput-e2e-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Process-level JSON-RPC smoke tests for Thruput"

# This crate exists only for integration tests.
# It does not produce a library.
[lib]
path = "src/lib.rs"

[dependencies]
thruput-json-rpc-client = { workspace = true }
thruput-json-rpc-types = { workspace = true }
thruput-signing = { workspace = true }
thruput-xdr = { workspace = true }
xdr-common = { workspace = true }
xdrs = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
jsonrpsee = { workspace = true }
