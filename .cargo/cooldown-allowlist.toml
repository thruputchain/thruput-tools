# Security fix for RUSTSEC-2026-0391
[[allow.exact]]
crate = "zstd"
version = "0.14.3"

# Security fix for RUSTSEC-2026-0410
[[allow.exact]]
crate = "zstd-sys"
version = "2.1.2+zstd.1.5.7"

# Security fix for RUSTSEC-2026-0406
[[allow.exact]]
crate = "zstd-safe"
version = "8.2.0"

[[allow.exact]]
crate = "rustls"
version = "0.23.46"

# Security fixes for RUSTSEC-2026-0382 and RUSTSEC-2026-0383.
[[allow.exact]]
crate = "rustls-webpki"
version = "0.103.16"

[[allow.exact]]
crate = "webpki-root-certs"
version = "1.0.10"

# Security fix for ctutils 0.4.3 and earlier (fixed in 0.4.4).
[[allow.exact]]
crate = "ctutils"
version = "0.4.5"

