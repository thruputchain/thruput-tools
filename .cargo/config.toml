[registries.groundhog]
index = "sparse+https://crates.thruput.network/api/v1/crates/"

[source.groundhog]
registry = "sparse+https://crates.thruput.network/api/v1/crates/"

# Host tooling only: do not merge these flags into RV32 contract builds.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "force-frame-pointers=yes"]

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "force-frame-pointers=yes", "-C", "link-arg=-Wl,--build-id=sha1"]
