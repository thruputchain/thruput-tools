[registries.groundhog]
index = "sparse+https://crates.thruput.network/api/v1/crates/"

[source.groundhog]
registry = "sparse+https://crates.thruput.network/api/v1/crates/"

# Migrated crate archives retain legacy registry URLs in their manifests.
# Keep vendored dependency identities on the canonical registry until those
# upstream crates are republished and our dependency pins are updated.
