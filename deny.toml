# cargo-deny configuration: advisory, license, source, and duplicate-version
# policy. https://embarkstudios.github.io/cargo-deny/
#
# Advisories are checked both per-PR (ci.yml) and daily (audit.yml). The daily
# run is what catches a new advisory filed against an already-frozen
# Cargo.lock, which a push-triggered job never sees.
#
# Every exception added to this file gets a comment naming the dependency
# that needs it and why.

[graph]
all-features = true

[advisories]
# 0.26.11 contains no certificates; it re-exports the patched 1.x package.
# Keep this exception paired with the version bans below. Remove it when
# jsonrpsee moves past rustls-platform-verifier 0.5 (wasm32 dependency).
ignore = [
    { id = "RUSTSEC-2026-0383", reason = "webpki-root-certs 0.26.11 re-exports 1.0.10; older certificate bundles are banned below" },
]
# Informational advisories (unsound, unmaintained) default to workspace-direct
# dependencies only.
unsound = "all"
unmaintained = "all"
# Inert while we fetch every run; matters only if the DB is cached or
# --offline is used. Default bound is 90 days; measured from the last fetch.
maximum-db-staleness = "P7D"

[licenses]
# Include unpublished workspace crates: their source is distributed here too.
allow = [
    "Apache-2.0",
    "MIT",
    # Rust core/std support crates: compiler-builtins, wasi and friends are
    # licensed Apache-2.0 WITH LLVM-exception, which is not implied by the
    # bare Apache-2.0 entry above.
    "Apache-2.0 WITH LLVM-exception",
    # adler2
    "0BSD",
    # fiat-crypto
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # dual-licensed Apache-2.0 OR BSL-1.0 (ryu)
    "BSL-1.0",
    # dunce
    "CC0-1.0",
    # webpki-root-certs: the Mozilla CA bundle, distributed under a
    # permissive data license rather than a code license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
    # dual-licensed Unlicense OR MIT (byteorder, memchr and similar)
    "Unlicense",
    "Zlib",
]
# NOTE: r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later". The permissive OR
# is satisfied by MIT/Apache-2.0 above, so LGPL is deliberately NOT allowed
# and carries no obligation for us. `cargo deny list` still prints r-efi under
# LGPL-2.1-or-later because it enumerates every license in an expression;
# that listing is not evidence of a copyleft dependency.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# RUSTSEC-2026-0383: only the certificate-free 0.26.11 compatibility package
# may remain below 1.0.10. It resolves its parent dependency to patched 1.x.
deny = [
    { name = "webpki-root-certs", version = "<0.26.11" },
    { name = "webpki-root-certs", version = ">0.26.11, <1.0.10" },
]
# Internal path dependencies carry no version requirement; every crate here is
# publish = false, so path wildcards are safe. Registry wildcards stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only: the crates publish there, and crates.io rejects a crate
# that depends on another registry.
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
