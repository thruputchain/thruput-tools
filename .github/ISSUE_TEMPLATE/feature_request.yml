name: Feature request
description: Propose a developer-tools improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and any alternatives you considered.
    validations:
      required: true
