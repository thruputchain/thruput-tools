version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "thruput-*"
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /crates/faucet/web
      - /scripts/scaffold-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "@thruputchain/*"
    open-pull-requests-limit: 3
    groups:
      javascript-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "thruputchain/*"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
