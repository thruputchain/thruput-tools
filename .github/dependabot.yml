version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Keep in sync with /cooldown.toml and /.cargo/cooldown*.toml.
    cooldown:
      default-days: 8
      exclude:
        - "thruput-*" # first-party crates
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /crates/faucet/web
      - /scripts/scaffold-app
    schedule:
      interval: weekly
    # Keep in sync with /crates/faucet/web/pnpm-workspace.yaml.
    cooldown:
      default-days: 8
      exclude:
        - "@thruputchain/*" # first-party packages
    open-pull-requests-limit: 3
    groups:
      javascript-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
      exclude:
        - "thruputchain/*"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
