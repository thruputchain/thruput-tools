# Manual, idempotent docs (re)generation for a given released version.
#
# Normal releases publish docs automatically via the inline "publish docs" step
# in publish.yml. Use this workflow to rebuild docs for an already-tagged version
# (e.g. if a publish-time docs build broke). It checks out the tag, asserts it,
# and re-uploads with force, so it's safe to run any number of times.
name: Publish docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)generate docs for, e.g. 0.5.4'
        required: true
      packages:
        description: 'Space-separated package list (default: the published set)'
        required: false
        default: >-
          groundhog-build-info
          groundhog-bundle-identity
          groundhog-json-rpc-types
          groundhog-open-rpc
          groundhog-open-rpc-macros
          groundhog-json-rpc-api
          groundhog-open-rpc-spec
          groundhog-x23-transport
          groundhog-tx-validation
          groundhog-json-rpc-server
          groundhog-json-rpc-client
          groundhog-signing
          groundhog-node-supervisor
          groundhog-rv32-artifact
          groundhog-rv32-lower
          groundhog-cli

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://thruput.network/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://thruput.network/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}

jobs:
  publish-docs:
    runs-on: hog1
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}

      - name: Checkout at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git to use SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          path: actions
          ref: b2409b8655be03b1a8667b7cf7e8b31bfe311e07

      - name: Build and publish docs
        uses: ./actions/cargo-doc
        with:
          packages: ${{ inputs.packages }}
          version: ${{ inputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          toolchain: nightly-2026-05-01
          force: 'true'
          expected-tag: v${{ inputs.version }}
