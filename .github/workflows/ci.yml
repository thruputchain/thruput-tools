name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  # Fallback if the CI runner overwrites .cargo/config.toml
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}

jobs:
  clippy:
    name: Clippy
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify crate and platform version reporting
        run: |
          set -euo pipefail

          package_args=(
            -p groundhog-json-rpc-gateway
            -p groundhog-cli
            -p groundhog-rv32-lower
            -p groundhog-sim
            -p groundhog-faucet
          )
          targets=(
            groundhog-json-rpc-gateway:hog-gateway
            groundhog-cli:groundhog
            groundhog-rv32-lower:rv32-lower
            groundhog-sim:hogsim
            groundhog-faucet:groundhog-faucet
          )

          verify_versions() {
            local suffix="$1"
            for target in "${targets[@]}"; do
              package=${target%%:*}
              app=${target#*:}
              crate_id=$(cargo pkgid --locked -p "$package")
              crate_version=${crate_id##*[@#]}
              test -n "$crate_version"
              test "$("target/debug/$app" --version)" = "$app $crate_version$suffix"
            done
          }

          env -u GROUNDHOG_DISTRIBUTION_VERSION \
            cargo build --quiet --locked "${package_args[@]}" --bins
          verify_versions ""

          GROUNDHOG_DISTRIBUTION_VERSION=0.0.0-ci \
            cargo build --quiet --locked "${package_args[@]}" --bins
          verify_versions " (platform 0.0.0-ci)"

  cli-smoke:
    name: CLI smoke (new + cargo test + groundhog test)
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Build groundhog CLI
        run: cargo build --locked -p groundhog-cli

      - name: Put groundhog on PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      # Scaffold outside the repo so the generated project stands on its own
      # config rather than inheriting the workspace.
      - name: Scaffold project (groundhog new)
        working-directory: ${{ runner.temp }}
        run: groundhog new my-counter

      - name: Host tests (cargo test)
        working-directory: ${{ runner.temp }}/my-counter
        run: cargo test

      - name: Contract tests (groundhog test)
        working-directory: ${{ runner.temp }}/my-counter
        run: groundhog test

      # A user-level rustflags override makes cargo drop the project's
      # .cargo/config.toml target rustflags (linker script, codegen flags such
      # as -Z trap-unreachable=false), yielding artifacts that fail validation.
      # The CLI must refuse to build instead of proceeding silently.
      - name: RUSTFLAGS guard (groundhog build refuses env rustflags)
        working-directory: ${{ runner.temp }}/my-counter
        run: |
          set -euo pipefail
          for probe in 'RUSTFLAGS=-C opt-level=2' 'CARGO_ENCODED_RUSTFLAGS='; do
            if env "$probe" groundhog build >guard.log 2>&1; then
              echo "groundhog build unexpectedly succeeded with $probe set"
              cat guard.log
              exit 1
            fi
            if ! grep -q "is set in the environment" guard.log; then
              echo "groundhog build failed for a reason other than the rustflags guard with $probe set"
              cat guard.log
              exit 1
            fi
          done

      # Wrapping a generated project into a parent workspace without adopting
      # its .cargo/config.toml makes cargo (run from the workspace root) drop
      # the Groundhog rustflags: no linker script means the rv32 build can
      # never produce a valid artifact, so the CLI must refuse with the
      # copy-the-config hint. The check asks `cargo config get`
      # (nightly-only), so the project's toolchain pin moves to the workspace
      # root the way a bootstrapper would. CARGO_HOME points at an empty
      # directory so the runner's global cargo config cannot satisfy the
      # check.
      - name: Rv32 linker-script guard (groundhog build refuses missing rustflags)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p wrapped empty-cargo-home
          mv my-counter wrapped/my-counter
          printf '[workspace]\nmembers = ["my-counter"]\nresolver = "2"\n' > wrapped/Cargo.toml
          cp wrapped/my-counter/rust-toolchain.toml wrapped/
          cd wrapped/my-counter
          if CARGO_HOME="${{ runner.temp }}/empty-cargo-home" groundhog build >guard.log 2>&1; then
            echo "groundhog build unexpectedly succeeded without the Groundhog rustflags"
            cat guard.log
            exit 1
          fi
          if ! grep -q 'no `-T` linker script' guard.log; then
            echo "groundhog build failed for a reason other than the rv32 linker-script guard"
            cat guard.log
            exit 1
          fi
