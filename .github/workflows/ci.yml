name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  # Check rust dependencies against policy
  dependency-policy:
    permissions:
      contents: read
    # No registry credentials: deny.toml admits crates.io only.
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6

  # Lint our workflows
  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6
    with:
      lint-app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
    secrets:
      lint-app-private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}

  clippy:
    needs: dependency-policy # Check deps before building anything
    name: Clippy
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (heap-profiling feature)
        run: cargo clippy --locked -p thruput-heap-profiling -p thruput-json-rpc-gateway -p thruput-faucet --all-targets --features thruput-heap-profiling/jemalloc,thruput-json-rpc-gateway/heap-profiling,thruput-faucet/heap-profiling -- -D warnings

      # Outside the workspace (see its Cargo.toml), so the steps above skip it.
      # --locked fails if its Cargo.lock no longer matches its manifest.
      - name: Clippy (bare thruput crate)
        working-directory: crates/thruput
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: dependency-policy # Check deps before building anything
    name: Test
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Format
        run: cargo fmt --check

      - name: Verify bundled documentation
        run: |
          python3 scripts/test_import_docs_snapshot.py
          python3 scripts/import-docs-snapshot.py
          cargo package -p thruput-cli --list --allow-dirty --locked > /tmp/cli-package-files.txt
          grep -Fx 'assets/docs/snapshot.tar.gz' /tmp/cli-package-files.txt
          grep -Fx 'assets/docs/snapshot-lock.json' /tmp/cli-package-files.txt

      - name: Test
        run: cargo test --workspace --locked

      - name: Test (heap-profiling feature)
        run: |
          cargo test --locked -p thruput-heap-profiling --features jemalloc
          cargo test --locked -p thruput-heap-profiling --features jemalloc --release

      - name: Verify component version and source reporting
        run: |
          set -euo pipefail

          package_args=(
            -p thruput-json-rpc-gateway
            -p thruput-cli
            -p thruput-rv32-lower
            -p thruput-faucet
          )
          targets=(
            thruput-json-rpc-gateway:hog-gateway
            thruput-cli:thruput
            thruput-rv32-lower:rv32-lower
            thruput-faucet:thruput-faucet
          )
          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"

          cargo test --quiet --locked -p thruput-cli \
            --test cli_integration_test version_flag
          cargo test --quiet --locked -p thruput-json-rpc-gateway \
            --test version_identity

          env -u GROUNDHOG_DISTRIBUTION_VERSION \
            cargo build --quiet --locked "${package_args[@]}" --bins
          for target in "${targets[@]}"; do
            package=${target%%:*}
            app=${target#*:}
            crate_id=$(cargo pkgid --locked -p "$package")
            crate_version=${crate_id##*[@#]}
            test -n "$crate_version"
            expected_version="$crate_version"
            if [ "$app" = thruput ] || [ "$app" = hog-gateway ]; then
              expected_version="$crate_version (commit ${source_commit:0:8})"
            fi
            test "$("target/debug/$app" --version)" = "$app $expected_version"
          done

      - name: Real runtime qualification
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo build --locked -p thruput-cli -p thruput-json-rpc-gateway --bins
          runtime_version=$(python3 -c 'import json; print(json.load(open("crates/toolchain/catalog/hog-devnode.json"))["defaultVersion"])')
          target/debug/thruput --json toolchain install "$runtime_version" > /tmp/history-toolchain.json
          export THRUPUT_DEVNODE_BINARY
          THRUPUT_DEVNODE_BINARY=$(python3 -c 'import json; print(json.load(open("/tmp/history-toolchain.json"))["data"]["path"])')
          export THRUPUT_GATEWAY_BINARY="$PWD/target/debug/hog-gateway"
          for test in real_block_queries real_local_state real_native_qualification real_network_identity; do
            cargo test --locked -p thruput-node-supervisor --test "$test" -- --ignored --test-threads=1
          done
          cargo test --locked -p thruput-cli --test native_rpc_qualification -- --ignored --test-threads=1

  cli-smoke:
    needs: dependency-policy # Check deps before building anything
    name: CLI smoke, ${{ matrix.template }} template (new + cargo build + cargo test + clippy + thruput test + thruput test --integration)
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    # Every template renders its own sources, so each one gets the full
    # build/test/lint loop a fresh project runs.
    strategy:
      fail-fast: false
      matrix:
        template: [counter, minimal]
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Build thruput CLI
        run: cargo build --locked -p thruput-cli

      - name: Put thruput on PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      # The scaffold pins thruput-json-rpc-client to this CLI version, which is
      # unpublished until the release runs. Build it against this checkout's
      # crate. publish.yml repeats the smoke against crates.io only.
      - name: Use this checkout's thruput-json-rpc-client
        run: scripts/use-checkout-client.sh "$RUNNER_TEMP"

      # Scaffold outside the repo so the generated project stands on its own
      # config rather than inheriting the workspace.
      - name: Scaffold project (thruput new)
        working-directory: ${{ runner.temp }}
        run: |
          if [ '${{ matrix.template }}' = minimal ]; then
            thruput new my-minimal
          else
            thruput new my-${{ matrix.template }} --template ${{ matrix.template }}
          fi

      # Plain `cargo build` is what IDEs run; it must succeed without `dev`.
      - name: Host build (cargo build)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo build

      - name: Host tests (cargo test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo test

      # The generated code is the first Rust a new user lints. It must be
      # clean under the same clippy a fresh project runs, tests included.
      - name: Host lint (cargo clippy)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Contract tests (thruput test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: thruput test

      - name: Check declared event metadata
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}/my-counter
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          spec = json.loads(Path("target/thruput/my_counter.spec.json").read_text())
          events = [event for event in spec["events"] if event["name"]["declared"] == "PingEvent"]
          assert len(events) == 1, "runtime PingEvent must also be declared in the contract spec"
          assert [topic["name"] for topic in events[0]["topics"]] == ["tag"]
          assert events[0]["fields"] == []
          PYTHON

      # Starts an ephemeral hog-devnode from the embedded catalog, deploys the
      # contract with a native local-user account, and runs tests/integration.rs.
      # Nothing else exercises the integration deploy end to end.
      - name: Integration tests (thruput test --integration)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: thruput test --integration

      # --node-arg must reach hog-devnode: an explicit valid capacity still
      # passes, and a bad one fails startup with hog-devnode's own parse error
      # (which a dropped argument could not produce).
      - name: Integration node args (thruput test --integration --node-arg)
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          set -euo pipefail
          thruput test --integration --node-arg "--ramdb-bytes 0x100000000"
          if thruput test --integration -v --node-arg "--ramdb-bytes not-a-size" >node-arg.log 2>&1; then
            echo "thruput test --integration unexpectedly succeeded with an invalid --ramdb-bytes"
            cat node-arg.log
            exit 1
          fi
          if ! grep -qF "Invalid --ramdb-bytes: not-a-size" node-arg.log; then
            echo "integration startup failed for a reason other than the forwarded --ramdb-bytes"
            cat node-arg.log
            exit 1
          fi

      # A user-level rustflags override makes cargo drop the project's
      # .cargo/config.toml target rustflags (linker script, codegen flags such
      # as -Z trap-unreachable=false), yielding artifacts that fail validation.
      # The CLI must refuse to build instead of proceeding silently.
      - name: RUSTFLAGS guard (thruput build refuses env rustflags)
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          set -euo pipefail
          for probe in 'RUSTFLAGS=-C opt-level=2' 'CARGO_ENCODED_RUSTFLAGS='; do
            if env "$probe" thruput build >guard.log 2>&1; then
              echo "thruput build unexpectedly succeeded with $probe set"
              cat guard.log
              exit 1
            fi
            if ! grep -q "is set in the environment" guard.log; then
              echo "thruput build failed for a reason other than the rustflags guard with $probe set"
              cat guard.log
              exit 1
            fi
          done

      # Wrapping a generated project into a parent workspace without adopting
      # its .cargo/config.toml makes cargo (run from the workspace root) drop
      # the Groundhog rustflags: no linker script means the rv32 build can
      # never produce a valid artifact, so the CLI must refuse with the
      # copy-the-config hint. The check asks `cargo config get`
      # (nightly-only), so the project's toolchain pin moves to the workspace
      # root the way a bootstrapper would. CARGO_HOME points at an empty
      # directory so the runner's global cargo config cannot satisfy the
      # check.
      - name: Rv32 linker-script guard (thruput build refuses missing rustflags)
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p wrapped empty-cargo-home
          mv my-counter wrapped/my-counter
          printf '[workspace]\nmembers = ["my-counter"]\nresolver = "2"\n' > wrapped/Cargo.toml
          cp wrapped/my-counter/rust-toolchain.toml wrapped/
          cd wrapped/my-counter
          if CARGO_HOME="${{ runner.temp }}/empty-cargo-home" thruput build >guard.log 2>&1; then
            echo "thruput build unexpectedly succeeded without the Groundhog rustflags"
            cat guard.log
            exit 1
          fi
          # shellcheck disable=SC2016
          if ! grep -q 'no `-T` linker script' guard.log; then
            echo "thruput build failed for a reason other than the rv32 linker-script guard"
            cat guard.log
            exit 1
          fi

  scaffold-app:
    needs: dependency-policy
    name: Counter app (generated project + real-node browser smoke)
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Set up Node.js and package authentication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@thruputchain'
      - name: Build CLI and install selected runtime
        run: |
          cargo build --locked -p thruput-cli
          ./target/debug/thruput toolchain install --non-interactive
      - name: Install browser test dependencies
        run: |
          npm ci --prefix scripts/scaffold-app
          npx --prefix scripts/scaffold-app playwright install --with-deps chromium
      # smoke.mjs scaffolds under TMPDIR; see cli-smoke for why it is patched.
      - name: Use this checkout's thruput-json-rpc-client
        run: scripts/use-checkout-client.sh "$RUNNER_TEMP"
      - name: Test generated counter app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
        run: npm test --prefix scripts/scaffold-app

  # Codegen tests assert on generated text. This job runs the real CLI over the
  # checked-in spec artifacts, then type-checks and runs what it generates.
  codegen-typecheck:
    needs: dependency-policy # Check deps before building anything
    name: Codegen typecheck (spec artifact -> thruput codegen ts -> tsc)
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    env:
      FIXTURES: crates/cli/fixtures/codegen
      # Matches the version client-ts builds with, so the bindings are checked
      # by the compiler that actually consumes them.
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Build thruput CLI
        run: cargo build --locked -p thruput-cli

      # Regenerating in place means the diff below also proves the checked-in
      # bindings are what the CLI emits today, not a stale snapshot.
      - name: Generate bindings from the checked-in spec artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=("$FIXTURES"/*.spec.xdr)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "no spec artifacts found in $FIXTURES"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            output="${artifact%.spec.xdr}.ts"
            echo "codegen $artifact -> $output"
            ./target/debug/thruput codegen ts "$artifact" --output "$output"
          done

      - name: Bindings match the checked-in snapshots
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- "$FIXTURES"; then
            echo
            echo "Generated bindings differ from the checked-in snapshots."
            echo "Run: UPDATE_SNAPSHOTS=1 cargo test -p thruput-cli --lib codegen"
            exit 1
          fi
          # git diff only covers tracked files, so check for untracked bindings too.
          untracked="$(git ls-files --others --exclude-standard -- "$FIXTURES")"
          if [ -n "$untracked" ]; then
            echo "Generated bindings that are not checked in:"
            echo "$untracked"
            echo "Commit them, or drop the spec artifact that produced them."
            exit 1
          fi

      # A clean tsc says nothing, so print the version first: a green log then
      # shows the compiler ran rather than leaving that to be assumed.
      - name: Type-check the generated bindings
        working-directory: crates/cli/fixtures/codegen/typecheck
        run: |
          set -euo pipefail
          npx --yes --package "typescript@${TYPESCRIPT_VERSION}" tsc --version
          npx --yes --package "typescript@${TYPESCRIPT_VERSION}" tsc -p tsconfig.json
          echo "tsc clean: generated bindings type-check"

      # A binding can type-check and still fail when it runs, so compile the
      # bindings and call every event decoder they generate.
      - name: Run the generated event decoders
        working-directory: crates/cli/fixtures/codegen/typecheck
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:?}/codegen-js"
          npx --yes --package "typescript@${TYPESCRIPT_VERSION}" tsc -p tsconfig.json \
            --noEmit false --rootDir .. --outDir "$out"
          echo '{ "type": "module" }' > "$out/package.json"
          node --version
          node decode-events.mjs "$out"

  faucet-web:
    name: Faucet web (format, build)
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # install @thruputchain/* from GitHub Packages
    defaults:
      run:
        working-directory: crates/faucet/web
    env:
      GH_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # corepack installs the pnpm version pinned by packageManager.
      - name: Install dependencies
        run: |
          corepack enable
          # pnpm only reads registry tokens from user-level config.
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GH_NPM_TOKEN"
          pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check and build
        run: pnpm build
