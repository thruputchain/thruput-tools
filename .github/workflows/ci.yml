name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  check:
    name: Format + Lint
    runs-on: namespace-profile-hogd-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Build + Test
    runs-on: namespace-profile-hogd-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test
