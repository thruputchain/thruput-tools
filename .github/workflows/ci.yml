name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  # Fallback if the CI runner overwrites .cargo/config.toml
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}

jobs:
  fmt:
    name: Format
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Format Check
        run: cargo fmt --check

  build-and-test:
    name: Clippy + Test
    needs: fmt
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Scaffold smoke test
        run: scripts/test-scaffold.sh
