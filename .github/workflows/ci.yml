name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  # Fallback if the CI runner overwrites .cargo/config.toml
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/

jobs:
  dependency-policy:
    name: Dependency policy (${{ matrix.check }})
    runs-on: namespace-profile-hogd-linux-2604
    strategy:
      fail-fast: false
      matrix:
        check:
          - advisories
          - licenses
          - bans
          - sources
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          # 1.85.0 is the Rust already baked into the pinned cargo-deny-action
          # image (FROM rust:1.85.0-alpine3.20). Setting it stops rustup from
          # honouring rust-toolchain.toml and downloading a second toolchain
          # just to run `cargo metadata`.  (cargo-deny compiles nothing.)
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          arguments: --all-features --locked
          command: check ${{ matrix.check }}

  workflow-lint:
    name: Workflow lint
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: "" # registry access not needed here
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.30.1"
      # zizmor publishes no checksum file; this is the hash of the v1.30.1
      # linux-gnu tarball as first fetched. It pins us against later
      # tampering with that asset, but is trust-on-first-use, not provenance.
      ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      # actionlint shells out to these
      - name: Install shellcheck and pyflakes
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            # A broken third-party list in the runner image must not fail the
            # whole update; the version checks below are the real guard.
            sudo apt-get update || true
            sudo apt-get install -y shellcheck python3-pyflakes
          fi
          shellcheck --version | head -2

      - name: Install actionlint and zizmor
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          bin="$HOME/.local/bin"
          mkdir -p "$bin"

          curl -fsSL -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint

          curl -fsSL -o "$tmp/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $tmp/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/zizmor.tar.gz" -C "$tmp" zizmor

          install -m755 "$tmp/actionlint" "$tmp/zizmor" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/actionlint" --version
          "$bin/zizmor" --version

      # Covers correctness (schema, expression types, cron syntax). Runs
      # shellcheck and pyflakes over inline code.
      - name: actionlint
        run: |
          set -euo pipefail
          pyflakes_bin="$(command -v pyflakes || command -v pyflakes3 || true)"
          if [ -n "$pyflakes_bin" ]; then
            actionlint -color -pyflakes "$pyflakes_bin"
          else
            echo "::warning::pyflakes not found; inline Python will not be checked"
            actionlint -color
          fi

      # Blocking. GH_TOKEN lets zizmor run impostor-commit and
      # known-vulnerable-actions.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/

      # Advisory only. The pedantic persona adds stale-action-refs and
      # ref-version-mismatch, which flag SHA pins that no longer point at a tag
      # and version comments that disagree with the pinned SHA. Not a reason to
      # block a PR, so failures are reported and ignored.
      - name: zizmor (pedantic, advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --persona=pedantic .github/workflows/

  clippy:
    name: Clippy
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Format
        run: cargo fmt --check

      - name: Verify bundled documentation
        run: |
          python3 scripts/import-docs-snapshot.py
          cargo package -p groundhog-cli --list --allow-dirty --locked > /tmp/cli-package-files.txt
          grep -Fx 'assets/docs/snapshot.tar.gz' /tmp/cli-package-files.txt
          grep -Fx 'assets/docs/snapshot-lock.json' /tmp/cli-package-files.txt

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify component version and source reporting
        run: |
          set -euo pipefail

          package_args=(
            -p groundhog-json-rpc-gateway
            -p groundhog-cli
            -p groundhog-rv32-lower
            -p groundhog-sim
            -p groundhog-faucet
          )
          targets=(
            groundhog-json-rpc-gateway:hog-gateway
            groundhog-cli:groundhog
            groundhog-rv32-lower:rv32-lower
            groundhog-sim:hogsim
            groundhog-faucet:groundhog-faucet
          )
          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"

          cargo test --quiet --locked -p groundhog-cli \
            --test cli_integration_test version_flag
          cargo test --quiet --locked -p groundhog-json-rpc-gateway \
            --test version_identity

          env -u GROUNDHOG_DISTRIBUTION_VERSION \
            cargo build --quiet --locked "${package_args[@]}" --bins
          for target in "${targets[@]}"; do
            package=${target%%:*}
            app=${target#*:}
            crate_id=$(cargo pkgid --locked -p "$package")
            crate_version=${crate_id##*[@#]}
            test -n "$crate_version"
            expected_version="$crate_version"
            if [ "$app" = groundhog ] || [ "$app" = hog-gateway ]; then
              expected_version="$crate_version (commit ${source_commit:0:8})"
            fi
            test "$("target/debug/$app" --version)" = "$app $expected_version"
          done

  cli-smoke:
    name: CLI smoke, ${{ matrix.template }} template (new + cargo build + cargo test + clippy + groundhog test)
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    # Every template renders its own sources, so each one gets the full
    # build/test/lint loop a fresh project runs.
    strategy:
      fail-fast: false
      matrix:
        template: [counter, stub]
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Build groundhog CLI
        run: cargo build --locked -p groundhog-cli

      - name: Put groundhog on PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      # Scaffold outside the repo so the generated project stands on its own
      # config rather than inheriting the workspace.
      - name: Scaffold project (groundhog new)
        working-directory: ${{ runner.temp }}
        run: groundhog new my-${{ matrix.template }} --template ${{ matrix.template }}

      # A release PR advances the scaffold to a client version that does not
      # exist in the registry until after merge. Exercise that exact source
      # without weakening the version emitted for real generated projects.
      - name: Use checked-out RPC client before registry publication
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          printf '\n[patch."sparse+https://crates.thruput.network/api/v1/crates/"]\ngroundhog-json-rpc-client = { path = "%s" }\n' \
            "$GITHUB_WORKSPACE/crates/json-rpc/json-rpc-client" \
            >> .cargo/config.toml

      # Plain `cargo build` is what IDEs run; it must succeed without `dev`.
      - name: Host build (cargo build)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo build

      - name: Host tests (cargo test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo test

      # The generated code is the first Rust a new user lints. It must be
      # clean under the same clippy a fresh project runs, tests included.
      - name: Host lint (cargo clippy)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Contract tests (groundhog test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: groundhog test

      # A user-level rustflags override makes cargo drop the project's
      # .cargo/config.toml target rustflags (linker script, codegen flags such
      # as -Z trap-unreachable=false), yielding artifacts that fail validation.
      # The CLI must refuse to build instead of proceeding silently.
      - name: RUSTFLAGS guard (groundhog build refuses env rustflags)
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          set -euo pipefail
          for probe in 'RUSTFLAGS=-C opt-level=2' 'CARGO_ENCODED_RUSTFLAGS='; do
            if env "$probe" groundhog build >guard.log 2>&1; then
              echo "groundhog build unexpectedly succeeded with $probe set"
              cat guard.log
              exit 1
            fi
            if ! grep -q "is set in the environment" guard.log; then
              echo "groundhog build failed for a reason other than the rustflags guard with $probe set"
              cat guard.log
              exit 1
            fi
          done

      # Wrapping a generated project into a parent workspace without adopting
      # its .cargo/config.toml makes cargo (run from the workspace root) drop
      # the Groundhog rustflags: no linker script means the rv32 build can
      # never produce a valid artifact, so the CLI must refuse with the
      # copy-the-config hint. The check asks `cargo config get`
      # (nightly-only), so the project's toolchain pin moves to the workspace
      # root the way a bootstrapper would. CARGO_HOME points at an empty
      # directory so the runner's global cargo config cannot satisfy the
      # check.
      - name: Rv32 linker-script guard (groundhog build refuses missing rustflags)
        if: matrix.template == 'counter'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p wrapped empty-cargo-home
          mv my-counter wrapped/my-counter
          printf '[workspace]\nmembers = ["my-counter"]\nresolver = "2"\n' > wrapped/Cargo.toml
          cp wrapped/my-counter/rust-toolchain.toml wrapped/
          cd wrapped/my-counter
          if CARGO_HOME="${{ runner.temp }}/empty-cargo-home" groundhog build >guard.log 2>&1; then
            echo "groundhog build unexpectedly succeeded without the Groundhog rustflags"
            cat guard.log
            exit 1
          fi
          # shellcheck disable=SC2016
          if ! grep -q 'no `-T` linker script' guard.log; then
            echo "groundhog build failed for a reason other than the rv32 linker-script guard"
            cat guard.log
            exit 1
          fi
