name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_THRUPUT_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
  PUBLISH_PACKAGES: >-
    thruput-build-info
    thruput-bundle-identity
    thruput-json-rpc-types
    thruput-open-rpc
    thruput-open-rpc-macros
    thruput-json-rpc-api
    thruput-open-rpc-spec
    thruput-x23-transport
    thruput-rv32-artifact
    thruput-tx-validation
    thruput-json-rpc-server
    thruput-hogd-backend
    thruput-json-rpc-client
    thruput-signing
    thruput-client
    thruput-node-supervisor
    thruput-rv32-lower
    thruput-toolchain
    thruput-cli-macros
    thruput-cli
    thruput-testkit

permissions:
  contents: read

jobs:
  publish:
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          persist-credentials: false
          path: actions
          ref: 16e3402eca906d0771f171ee95fcba8a0be8b0aa # configurable dry-run registry

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack@0.6.45

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          registry-name: thruput
          packages: ${{ env.PUBLISH_PACKAGES }}
