name: Hex buffer experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/json-rpc/json-rpc-types/**'
      - '.github/workflows/hex-experiment.yml'
permissions:
  contents: read
env:
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
jobs:
  measure:
    if: github.head_ref == 'codex/hex-uninitialized-buffer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          cache: rust
      - name: Host and compiler
        run: |
          rustc -Vv
          lscpu
      - name: Paired benchmark trials
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          echo "Pinned CPU: $cpu"
          for trial in 1 2; do
            echo "EXPERIMENT_RUN=$trial"
            taskset -c "$cpu" cargo bench --locked -p groundhog-json-rpc-types --bench hex_serialization
          done
      - name: Miri on production formatter
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hex-miri"
          root.mkdir(exist_ok=True)
          source = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "crates/json-rpc/json-rpc-types/src/hex/display.rs"
          (root / "Cargo.toml").write_text('[package]\nname="hex-miri"\nversion="0.0.0"\nedition="2024"\n[dependencies]\nhex="=0.4.3"\n[lib]\npath="lib.rs"\n')
          (root / "lib.rs").write_text('#[path = "' + str(source) + '"]\nmod display;\npub fn format_hex(input: &[u8]) -> String { display::HexDisplay(input).to_string() }\n')
          PY
          cargo +nightly miri test --manifest-path "$RUNNER_TEMP/hex-miri/Cargo.toml"
