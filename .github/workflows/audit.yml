# Catch advisories filed against dependencies since we last pushed.
name: Rust dependency audit

on:
  schedule:
    - cron: '0 8 * * *' # daily at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Check dependency policy
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3
    with:
      runs-on: namespace-profile-hogd-linux-2604
      checks: advisories

  # This workflow is asynchronous, so report problems by filing an issue
  notify:
    name: Report dependency problem
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3
    with:
      runs-on: namespace-profile-hogd-linux-2604
