name: Release package

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
  PUBLISH_PACKAGES: >-
    groundhog-build-info
    groundhog-bundle-identity
    groundhog-json-rpc-types
    groundhog-open-rpc
    groundhog-open-rpc-macros
    groundhog-json-rpc-api
    groundhog-open-rpc-spec
    groundhog-x23-transport
    groundhog-tx-validation
    groundhog-json-rpc-server
    groundhog-json-rpc-client
    groundhog-signing
    groundhog-node-supervisor
    groundhog-rv32-artifact
    groundhog-rv32-lower
    groundhog-cli
    groundhog-testkit

jobs:
  publish:
    permissions:
      actions: write
      contents: write
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          path: actions
          ref: b2409b8655be03b1a8667b7cf7e8b31bfe311e07

      - name: dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: tag commit with version
        id: publish-tag
        uses: ./actions/cargo-version-tag
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: publish
        uses: ./actions/cargo-publish
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

      # Build and upload rustdoc to groundhog.dev/docs. The tag was created
      # locally by cargo-version-tag, so HEAD is the tagged commit here.
      - name: publish docs
        uses: ./actions/cargo-doc
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          version: ${{ steps.publish-tag.outputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          toolchain: nightly-2026-05-01
          force: 'true'
          expected-tag: ${{ steps.publish-tag.outputs.tag }}

      - name: push tag
        run: |
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git
          TAG="${{ steps.publish-tag.outputs.tag }}"
          LOCAL_COMMIT=$(git rev-parse "$TAG")
          # Check if tag exists on remote and get its commit SHA
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            # Tag exists on remote, verify it points to the same commit
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote and points to the same commit ($LOCAL_COMMIT). Skipping push."
            else
              echo "Error: Tag $TAG exists on remote but points to different commit!"
              echo "Remote: $REMOTE_TAG_REF"
              echo "Local: $LOCAL_COMMIT"
              exit 1
            fi
          else
            # Tag doesn't exist on remote, push it
            git push origin "$TAG"
          fi
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: trigger binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.publish-tag.outputs.tag }}"
