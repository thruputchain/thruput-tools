name: Release package

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_THRUPUT_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
  PUBLISH_PACKAGES: >-
    thruput-build-info
    thruput-bundle-identity
    thruput-encoding
    thruput-json-rpc-types
    thruput-open-rpc
    thruput-open-rpc-macros
    thruput-json-rpc-api
    thruput-open-rpc-spec
    thruput-x23-transport
    thruput-rv32-artifact
    thruput-tx-validation
    thruput-json-rpc-server
    thruput-hogd-backend
    thruput-json-rpc-client
    thruput-signing
    thruput-client
    thruput-node-supervisor
    thruput-rv32-lower
    thruput-toolchain
    thruput-cli-macros
    thruput-cli
    thruput-testkit

permissions:
  contents: read

jobs:
  publish:
    permissions:
      actions: write
      contents: write
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: true

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack@0.6.45

      # Fail before creating a tag or publishing any crate if the CLI's
      # committed default is unavailable, malformed, or incompatible.
      - name: Verify managed toolchain catalog and public bundles
        shell: bash
        run: |
          cargo test --locked -p thruput-toolchain --test catalog_contract
          cargo test --locked -p thruput-toolchain --test install_contract public_catalog_installs_all_targets -- --ignored --exact --color never | tee "$RUNNER_TEMP/public-bundle-tests.log"
          grep -q '^test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/public-bundle-tests.log"

      - name: Verify managed toolchain startup with a fresh cache
        run: |
          python3 --version
          scripts/smoke-managed-toolchain.sh

      - name: dry run
        uses: thruputchain/actions/cargo-publish-dry-run@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          registry-name: thruput
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: tag commit with version
        id: publish-tag
        uses: thruputchain/actions/cargo-version-tag@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: publish
        uses: thruputchain/actions/cargo-publish@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          publish-delay-seconds: '10'

      - name: push tag
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          git remote set-url origin "https://${ACTOR}:${TOKEN}@github.com/${REPO}.git"
          LOCAL_COMMIT=$(git rev-parse "$TAG")
          # Check if tag exists on remote and get its commit SHA
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            # Tag exists on remote, verify it points to the same commit
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote and points to the same commit ($LOCAL_COMMIT). Skipping push."
            else
              echo "Error: Tag $TAG exists on remote but points to different commit!"
              echo "Remote: $REMOTE_TAG_REF"
              echo "Local: $LOCAL_COMMIT"
              exit 1
            fi
          else
            # Tag doesn't exist on remote, push it
            git push origin "$TAG"
          fi

      - name: trigger binary release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"$TAG\"}"

  # Scaffolds pin thruput-json-rpc-client to the CLI version, so CI can only
  # build them against the checkout. Check that a fresh scaffold resolves and
  # builds from the registry alone now that this version is published.
  registry-smoke:
    needs: publish
    name: Registry smoke, ${{ matrix.template }} template (new + cargo build + cargo test)
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: [counter, minimal]
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Build thruput CLI
        run: cargo build --locked -p thruput-cli

      - name: Scaffold project (thruput new)
        working-directory: ${{ runner.temp }}
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          if [ "$TEMPLATE" = minimal ]; then
            "$GITHUB_WORKSPACE/target/debug/thruput" new my-minimal
          else
            "$GITHUB_WORKSPACE/target/debug/thruput" new "my-$TEMPLATE" --template "$TEMPLATE"
          fi

      - name: Host build and tests (cargo build + cargo test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          cargo build
          cargo test
