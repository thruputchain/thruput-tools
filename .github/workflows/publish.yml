name: Release package

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
  PUBLISH_PACKAGES: >-
    groundhog-build-info
    groundhog-bundle-identity
    groundhog-json-rpc-types
    groundhog-open-rpc
    groundhog-open-rpc-macros
    groundhog-json-rpc-api
    groundhog-open-rpc-spec
    groundhog-x23-transport
    groundhog-rv32-artifact
    groundhog-tx-validation
    groundhog-json-rpc-server
    groundhog-hogd-backend
    groundhog-json-rpc-client
    groundhog-signing
    groundhog-client
    groundhog-node-supervisor
    groundhog-rv32-lower
    groundhog-toolchain
    groundhog-cli
    groundhog-testkit

jobs:
  publish:
    permissions:
      actions: write
      contents: write
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: true

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          path: actions
          ref: b2409b8655be03b1a8667b7cf7e8b31bfe311e07

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack@0.6.45

      # Fail before creating a tag or publishing any crate if the CLI's
      # committed default is unavailable, malformed, or incompatible.
      - name: Verify managed toolchain catalog and public bundles
        shell: bash
        run: |
          cargo test --locked -p groundhog-toolchain --test catalog_contract
          cargo test --locked -p groundhog-toolchain --test install_contract public_catalog_installs_all_targets -- --ignored --exact --color never | tee "$RUNNER_TEMP/public-bundle-tests.log"
          grep -q '^test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/public-bundle-tests.log"

      - name: Verify managed toolchain startup with a fresh cache
        run: |
          python3 --version
          scripts/smoke-managed-toolchain.sh

      - name: dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: tag commit with version
        id: publish-tag
        uses: ./actions/cargo-version-tag
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: publish
        uses: ./actions/cargo-publish
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          publish-delay-seconds: '20'

      - name: push tag
        run: |
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git
          TAG="${{ steps.publish-tag.outputs.tag }}"
          LOCAL_COMMIT=$(git rev-parse "$TAG")
          # Check if tag exists on remote and get its commit SHA
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            # Tag exists on remote, verify it points to the same commit
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote and points to the same commit ($LOCAL_COMMIT). Skipping push."
            else
              echo "Error: Tag $TAG exists on remote but points to different commit!"
              echo "Remote: $REMOTE_TAG_REF"
              echo "Local: $LOCAL_COMMIT"
              exit 1
            fi
          else
            # Tag doesn't exist on remote, push it
            git push origin "$TAG"
          fi
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: trigger binary release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"$TAG\"}"
