# Releases every published crate in this repository to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions, then
# dispatches the binary release. The crates share the workspace version and
# release under its `v<version>` tag.
#
# Nothing is tagged until the toolchain checks, the dry run and the release
# checks pass, so a run that fails before tagging leaves the repository
# untouched. Publishing skips versions crates.io already has from this
# release, so a run that fails partway is resumed by dispatching it again on
# the tagged commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. Creating a
# crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io API token
# with the scopes publish-new, trusted-publishing and change-owners. The
# publish steps register this workflow as each new crate's trusted publisher
# and add CRATE_OWNERS as its owners, so remove the secret and revoke the
# token once every crate exists.
#
# The job runs in the `release` environment, and the trusted publishers the
# publish steps register require it, so only runs that environment's
# protection rules admit (required reviewers, deployment branches limited to
# main) can publish. Keep CRATESIO_CREATE_PACKAGE_TOKEN a secret of
# `release`, not of the repository: repository secrets reach every branch.
#
# crates.io lets a token create five crates in a burst, then one every ten
# minutes, and the publish steps wait those limits out: a release that
# creates every crate here takes about three hours.
#
# Dispatch with dry-run for the checks, with no tagging, publishing or binary
# release.
name: Release package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish checks only; skip tagging, publishing and the binary release'
        type: boolean
        default: false

# Two concurrent releases would race on tags and crates.io state; queue them.
concurrency:
  group: publish

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # Every published workspace crate, in dependency order, dev-dependencies
  # included: the dry run packages each crate into vendor/ before the next one
  # resolves against it, and each crate's dependencies must be live on
  # crates.io before it publishes.
  PACKAGES: >-
    thruput-build-info
    thruput-bundle-identity
    thruput-encoding
    thruput-json-rpc-types
    thruput-open-rpc
    thruput-open-rpc-macros
    thruput-json-rpc-api
    thruput-open-rpc-spec
    thruput-x23-transport
    thruput-rv32-artifact
    thruput-tx-validation
    thruput-json-rpc-server
    thruput-hogd-backend
    thruput-json-rpc-client
    thruput-signing
    thruput-client
    thruput-node-supervisor
    thruput-rv32-lower
    thruput-toolchain
    thruput-cli-macros
    thruput
    thruput-testkit

permissions:
  contents: read

jobs:
  publish:
    permissions:
      actions: write # dispatches release.yml
      contents: write # pushes the release tag
      id-token: write # crates.io trusted publishing
    environment: release
    runs-on: namespace-profile-hogd-linux-2604
    outputs:
      released: ${{ steps.check.outputs.release == 'true' && !inputs.dry-run }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false
          # Full history and tags: the release checks read the tags.
          fetch-depth: 0

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack@0.6.45

      # A crate missing from PACKAGES would never be published, and a crate
      # that depends on it would then fail to publish halfway through.
      - name: Check PACKAGES lists every published crate
        run: |
          set -euo pipefail
          expected=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          listed=$(tr -s '[:space:]' '\n' <<<"$PACKAGES" | sed '/^$/d' | sort)
          if [ "$expected" != "$listed" ]; then
            echo "::error::PACKAGES in publish.yml doesn't match the workspace's published crates"
            diff <(echo "$expected") <(echo "$listed") || true
            exit 1
          fi

      # Tests stay in the repository: [workspace.package] excludes /tests and
      # every published crate inherits it. A crate that sets its own
      # `exclude` replaces the inherited one, so check what each would ship.
      - name: Check published crates leave tests/ out
        run: |
          set -euo pipefail
          status=0
          for package in $PACKAGES; do
            if cargo package --list --locked --package "$package" | grep '^tests/'; then
              echo "::error::$package would publish its tests/ directory"
              status=1
            fi
          done
          exit "$status"

      # Fail before creating a tag or publishing any crate if the CLI's
      # committed default is unavailable, malformed, or incompatible.
      - name: Verify managed toolchain catalog and public bundles
        shell: bash
        run: |
          cargo test --locked -p thruput-toolchain --test catalog_contract
          cargo test --locked -p thruput-toolchain --test install_contract public_catalog_installs_all_targets -- --ignored --exact --color never | tee "$RUNNER_TEMP/public-bundle-tests.log"
          grep -q '^test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/public-bundle-tests.log"

      - name: Verify managed toolchain startup with a fresh cache
        run: |
          python3 --version
          scripts/smoke-managed-toolchain.sh

      - name: Publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          registry-name: crates-io
          packages: ${{ env.PACKAGES }}

      # `v<version>` must be free or already on HEAD: a new commit needs a
      # version bump.
      - name: Check release
        id: check
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: ${{ env.PACKAGES }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Tag release
        id: tag
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: ${{ env.PACKAGES }}
          github-token: ${{ github.token }}

      - name: Publish
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: publish
          packages: ${{ env.PACKAGES }}
          git-tag: ${{ steps.tag.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Trigger binary release
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"$TAG\"}"

  # Scaffolds pin thruput-json-rpc-client to the CLI version, so CI can only
  # build them against the checkout. Check that a fresh scaffold resolves and
  # builds from crates.io alone now that this version is published.
  crates-io-smoke:
    needs: publish
    if: ${{ needs.publish.outputs.released == 'true' }}
    name: crates.io smoke, ${{ matrix.template }} template (new + cargo build + cargo test)
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: [counter, minimal]
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install published CLI
        shell: bash
        run: |
          crate_id=$(cargo pkgid --locked -p thruput)
          version=${crate_id##*[@#]}
          cargo install thruput --version "=$version" --locked \
            --root "$RUNNER_TEMP/published-cli"
          test "$("$RUNNER_TEMP/published-cli/bin/thruput" --version)" = \
            "thruput $version (commit ${GITHUB_SHA:0:8})"

      - name: Scaffold project (thruput new)
        working-directory: ${{ runner.temp }}
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          if [ "$TEMPLATE" = minimal ]; then
            "$RUNNER_TEMP/published-cli/bin/thruput" new my-minimal
          else
            "$RUNNER_TEMP/published-cli/bin/thruput" new "my-$TEMPLATE" --template "$TEMPLATE"
          fi

      - name: Host build and tests (cargo build + cargo test)
        working-directory: ${{ runner.temp }}/my-${{ matrix.template }}
        run: |
          cargo build
          cargo test
