name: Local demo CLI artifact
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/local-demo-cli.yml']
permissions:
  contents: read
env:
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
jobs:
  cli:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 30
    steps:
      - uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          cache: rust
      - name: Build release CLI
        run: |
          cargo build --release --locked -p groundhog-cli
          cargo build --release --locked -p groundhog-signing --example pubkey_signer
      - name: Package executable and runtime libraries
        run: |
          python3 - <<'PY'
          import hashlib, json, re, shutil, subprocess
          from pathlib import Path
          root = Path('local-demo-cli')
          (root / 'bin').mkdir(parents=True)
          (root / 'lib').mkdir()
          binaries = {'groundhog': Path('target/release/groundhog'),
                      'pubkey-signer': Path('target/release/examples/pubkey_signer')}
          libraries = set()
          for name, binary in binaries.items():
              shutil.copy2(binary, root / 'bin' / (name + '.real'))
              linked = subprocess.check_output(['ldd', str(binary)], text=True)
              assert 'not found' not in linked, linked
              libraries.update(re.findall(r'(/[^\s()]+)', linked))
          loaders = []
          for library in libraries:
              path = Path(library)
              shutil.copy2(path, root / 'lib' / path.name)
              if path.name.startswith('ld-linux'):
                  loaders.append(path.name)
          assert len(loaders) == 1, loaders
          for name in binaries:
              wrapper = root / 'bin' / name
              wrapper.write_text('#!/bin/sh\nset -eu\nbundle_dir=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)\n'
                  + 'exec "$bundle_dir/lib/' + loaders[0]
                  + '" --library-path "$bundle_dir/lib" "$bundle_dir/bin/' + name + '.real" "$@"\n')
              wrapper.chmod(0o755)
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'sha256': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                                 for p in sorted(root.rglob('*')) if p.is_file()}}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          local-demo-cli/bin/groundhog --version
          tar -czf local-demo-cli.tar.gz local-demo-cli
          sha256sum local-demo-cli.tar.gz > local-demo-cli.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: local-demo-cli-linux-x86_64
          path: |
            local-demo-cli.tar.gz
            local-demo-cli.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
