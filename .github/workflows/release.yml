name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
  RELEASE_TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: write

jobs:
  release:
    runs-on: namespace-profile-chuckd-rs-linux
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Build hogway
        run: cargo build --locked --release -p groundhog-rpc-gateway --bin hogway

      - name: Build groundhog CLI
        run: cargo build --locked --release -p groundhog-cli --bin groundhog --features dev-node

      - name: Verify hogway
        run: target/release/hogway --help

      - name: Verify groundhog CLI
        run: target/release/groundhog --help

      - name: Prepare artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts package

          for app in hogway groundhog; do
            archive_base="${app}-${GITHUB_REF_NAME}-${RELEASE_TARGET}"
            package_dir="package/${archive_base}"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            chmod +x "$package_dir/$app"
            tar -czf "artifacts/${archive_base}.tar.gz" -C package "$archive_base"
          done

          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
