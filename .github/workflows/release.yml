name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
  RELEASE_CRATES: >-
    groundhog-bundle-identity
    groundhog-cli
    groundhog-rv32-lower

permissions:
  # The publish job raises this to "write"
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            machine: x86_64
            platform: linux
            release_target: x86_64-unknown-linux-gnu
            runner: namespace-profile-hogd-linux-2604
            artifact_name: groundhog-rpc-x86_64-release-artifacts
            release_apps: hog-gateway groundhog rv32-lower hogsim groundhog-faucet hog-firehose
          - architecture: arm64
            machine: aarch64
            platform: linux
            release_target: aarch64-unknown-linux-gnu
            runner: namespace-profile-hogd-linux-arm64
            artifact_name: groundhog-rpc-arm64-release-artifacts
            release_apps: hog-gateway groundhog rv32-lower hogsim groundhog-faucet hog-firehose
          - architecture: arm64
            machine: arm64
            platform: macos
            release_target: aarch64-apple-darwin
            runner: namespace-profile-hogd-arm64-macos
            artifact_name: groundhog-rpc-macos-arm64-release-artifacts
            release_apps: groundhog
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Read crate version
        run: |
          crate_id=$(cargo pkgid --locked -p groundhog-cli)
          crate_version=${crate_id##*[@#]}
          test -n "$crate_version"
          echo "CRATE_VERSION=$crate_version" >> "$GITHUB_ENV"

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Verify publish-driven release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ "${GITHUB_ACTOR}" != "github-actions[bot]" ]; then
            echo "release.yml is internal; run the Release package workflow instead."
            echo "Unexpected actor: ${GITHUB_ACTOR}"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release.yml must be dispatched on a release tag ref, got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$CRATE_VERSION" != "$VERSION" ]; then
            echo "Release tag version $VERSION does not match workspace crate version $CRATE_VERSION"
            exit 1
          fi
          for crate in $RELEASE_CRATES; do
            cargo info "${crate}@${VERSION}" --registry groundhog >/dev/null
            echo "OK: ${crate}@${VERSION} exists in the groundhog registry"
          done

      - name: Verify component version and source wiring
        if: github.event_name == 'pull_request' && matrix.architecture == 'x86_64'
        run: |
          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"
          cargo build --locked --release \
            -p groundhog-json-rpc-gateway \
            -p groundhog-cli \
            -p groundhog-rv32-lower \
            -p groundhog-sim \
            -p groundhog-faucet \
            -p groundhog-firehose \
            --bins

          for app in hog-gateway groundhog rv32-lower hogsim groundhog-faucet hog-firehose; do
            app_version="$CRATE_VERSION"
            if [ "$app" = groundhog ] || [ "$app" = hog-gateway ]; then
              app_version="$CRATE_VERSION (commit ${source_commit:0:8})"
            fi
            test "$(target/release/$app --version)" = "$app $app_version"
          done

      - name: Build release binaries
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"
          expected_version="$CRATE_VERSION"
          # A runner-inherited legacy stamp must not label loose component artifacts as releases.
          unset GROUNDHOG_DISTRIBUTION_VERSION
          echo "EXPECTED_BINARY_VERSION=$expected_version" >> "$GITHUB_ENV"
          echo "EXPECTED_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

          package_args=()
          for app in $RELEASE_APPS; do
            case "$app" in
              hog-gateway) package_args+=(-p groundhog-json-rpc-gateway) ;;
              groundhog) package_args+=(-p groundhog-cli) ;;
              rv32-lower) package_args+=(-p groundhog-rv32-lower) ;;
              hogsim) package_args+=(-p groundhog-sim) ;;
              groundhog-faucet) package_args+=(-p groundhog-faucet) ;;
              hog-firehose) package_args+=(-p groundhog-firehose) ;;
              *)
                echo "unsupported release app: $app" >&2
                exit 1
                ;;
            esac
          done

          cargo build --locked --release "${package_args[@]}" --bins

      - name: Verify release agent guidance
        run: |
          cargo run --locked -p groundhog-agent-knowledge -- check
          target/release/groundhog --skill > agent-guide.md
          cmp agent-guide.md crates/tools/cli/assets/groundhog/knowledge/generated/agent-guide.md

      - name: Verify macOS CLI portability
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail

          file target/release/groundhog | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --strict --verbose=4 target/release/groundhog

          unexpected_deps=$(
            otool -L target/release/groundhog \
              | tail -n +2 \
              | awk '$1 !~ /^\/System\/Library\// && $1 !~ /^\/usr\/lib\// { print $1 }'
          )
          if [ -n "$unexpected_deps" ]; then
            echo "groundhog has non-system macOS dependencies:" >&2
            echo "$unexpected_deps" >&2
            exit 1
          fi

      - name: Prepare and verify artifacts
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          mkdir -p artifacts package
          release_ref=${GITHUB_REF_NAME//\//-}

          for app in $RELEASE_APPS; do
            archive_base="${app}-${release_ref}-${{ matrix.release_target }}"
            package_dir="package/${archive_base}"
            archive="artifacts/${archive_base}.tar.gz"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            if [ "$app" = groundhog ]; then
              cp agent-guide.md "$package_dir/"
            fi
            chmod +x "$package_dir/$app"
            tar -czf "$archive" -C package "$archive_base"

            verify_dir="verify/${archive_base}"
            mkdir -p "$verify_dir"
            tar -xzf "$archive" -C "$verify_dir"
            test -x "$verify_dir/$archive_base/$app"
            test -f "$verify_dir/$archive_base/README.md"
            test -f "$verify_dir/$archive_base/LICENSE"
            if [ "$app" = groundhog ]; then
              "$verify_dir/$archive_base/$app" --skill > "$verify_dir/rendered-guide.md"
              cmp "$verify_dir/rendered-guide.md" "$verify_dir/$archive_base/agent-guide.md"
            fi
            expected_version=${EXPECTED_BINARY_VERSION}
            if [ "$app" = groundhog ] || [ "$app" = hog-gateway ]; then
              expected_version="$CRATE_VERSION (commit ${EXPECTED_SOURCE_COMMIT:0:8})"
            fi
            test "$("$verify_dir/$archive_base/$app" --version)" = "$app $expected_version"
          done

      - name: Stage standalone agent guide
        if: matrix.platform == 'linux' && matrix.architecture == 'x86_64'
        run: cp agent-guide.md artifacts/agent-guide.md

      # Explicit target keeps CI host features out of the artifact contract.
      # Runtime qualification belongs on a Zen 5 deployment host.
      - name: Build and package Zen 5 gateway
        if: matrix.platform == 'linux' && matrix.architecture == 'x86_64'
        env:
          RUSTFLAGS: "-C target-cpu=znver5"
          CARGO_TARGET_DIR: target/znver5
        run: |
          set -euo pipefail
          unset GROUNDHOG_DISTRIBUTION_VERSION
          export GROUNDHOG_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT"
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p groundhog-json-rpc-gateway --bin hog-gateway
          release_ref=${GITHUB_REF_NAME//\//-}
          archive_base="hog-gateway-${release_ref}-x86_64-unknown-linux-gnu-znver5"
          mkdir -p "package/$archive_base"
          cp target/znver5/x86_64-unknown-linux-gnu/release/hog-gateway README.md LICENSE "package/$archive_base/"
          tar -czf "artifacts/$archive_base.tar.gz" -C package "$archive_base"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/*.tar.gz
            artifacts/agent-guide.md
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-x86_64-release-artifacts
          path: artifacts/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-arm64-release-artifacts
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-macos-arm64-release-artifacts
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 14
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          test -s agent-guide.md
          sha256sum -- "${archives[@]}" agent-guide.md > SHA256SUMS

      - name: Upload assembled release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: groundhog-rpc-release-artifacts
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/agent-guide.md
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: write
    steps:
      - name: Download assembled release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-release-artifacts
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/agent-guide.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
