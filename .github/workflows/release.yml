name: Release

on:
  workflow_dispatch:
    inputs:
      release-ref:
        description: 'Existing vX.Y.Z tag to package; workflow must run from main'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/split-release-debuginfo.sh'
      - 'scripts/split-release-dsym.sh'
      - 'scripts/test_split_release_dsym.py'
      - 'Cargo.toml'
      - '.cargo/config.toml'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RELEASE_REF: ${{ inputs.release-ref || github.ref_name }}
  RELEASE_CRATES: >-
    thruput-bundle-identity
    thruput
    thruput-rv32-lower

permissions:
  # The publish job raises this to "write"
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.release-ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            machine: x86_64
            platform: linux
            release_target: x86_64-unknown-linux-gnu
            github_runner: ubuntu-24.04
            namespace_runner: namespace-profile-hogd-linux-2604
            artifact_name: groundhog-rpc-x86_64-release-artifacts
            release_apps: >-
              hog-gateway thruput rv32-lower thruput-faucet
              hog-firehose-store hog-firehose-serve
          - architecture: arm64
            machine: aarch64
            platform: linux
            release_target: aarch64-unknown-linux-gnu
            github_runner: ubuntu-24.04-arm
            namespace_runner: namespace-profile-hogd-linux-arm64
            artifact_name: groundhog-rpc-arm64-release-artifacts
            release_apps: >-
              hog-gateway thruput rv32-lower thruput-faucet
              hog-firehose-store hog-firehose-serve
          - architecture: arm64
            machine: arm64
            platform: macos
            release_target: aarch64-apple-darwin
            github_runner: macos-26
            namespace_runner: namespace-profile-hogd-arm64-macos
            artifact_name: groundhog-rpc-macos-arm64-release-artifacts
            release_apps: thruput
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.github_runner || matrix.namespace_runner }}
    permissions:
      contents: read
    steps:
      - name: Verify publish-driven workflow ref
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR_ID" != 41898282 ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::release.yml is internal; dispatch Release package from main'
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::release-ref must be an existing vX.Y.Z tag'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release-ref) || github.ref }}
          fetch-depth: 0

      - name: Verify reviewed release source
        if: github.event_name != 'pull_request'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::release tag must point to reviewed main history'
            exit 1
          fi

      - name: Set up Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'release-github-rust' || 'release-namespace-rust' }}
          cache-bin: false
          save-if: false

      - name: Read crate version
        run: |
          crate_id=$(cargo pkgid --locked -p thruput)
          crate_version=${crate_id##*[@#]}
          test -n "$crate_version"
          echo "CRATE_VERSION=$crate_version" >> "$GITHUB_ENV"

      - name: Test macOS debuginfo packaging
        run: python3 -m unittest discover -s scripts -p test_split_release_dsym.py

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Verify published crate versions
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          TAG="$RELEASE_REF"
          VERSION="${TAG#v}"
          if [ "$CRATE_VERSION" != "$VERSION" ]; then
            echo "Release tag version $VERSION does not match workspace crate version $CRATE_VERSION"
            exit 1
          fi
          for crate in $RELEASE_CRATES; do
            cargo info "${crate}@${VERSION}" --registry crates-io >/dev/null
            echo "OK: ${crate}@${VERSION} exists on crates.io"
          done

      - name: Verify component version and source wiring
        if: github.event_name == 'pull_request' && matrix.architecture == 'x86_64'
        run: |
          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"
          cargo build --locked --release \
            -p thruput-json-rpc-gateway \
            -p thruput \
            -p thruput-rv32-lower \
            -p thruput-faucet \
            -p thruput-firehose \
            --bins

          for app in ${{ matrix.release_apps }}; do
            app_version="$CRATE_VERSION"
            if [ "$app" = thruput ] || [ "$app" = hog-gateway ]; then
              app_version="$CRATE_VERSION (commit ${source_commit:0:8})"
            fi
            test "$(target/release/$app --version)" = "$app $app_version"
          done

      - name: Build release binaries
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          source_commit=$(git rev-parse HEAD)
          export GROUNDHOG_SOURCE_COMMIT="$source_commit"
          expected_version="$CRATE_VERSION"
          # A runner-inherited legacy stamp must not label loose component artifacts as releases.
          unset GROUNDHOG_DISTRIBUTION_VERSION
          echo "EXPECTED_BINARY_VERSION=$expected_version" >> "$GITHUB_ENV"
          echo "EXPECTED_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

          # Gateway and faucet ship with jemalloc and inactive heap profiling;
          # GROUNDHOG_HEAP_PROFILING=1 turns it on. The feature is Linux-only.
          package_args=()
          features=()
          for app in $RELEASE_APPS; do
            case "$app" in
              hog-gateway)
                package_args+=(-p thruput-json-rpc-gateway)
                features+=(thruput-json-rpc-gateway/heap-profiling)
                ;;
              thruput) package_args+=(-p thruput) ;;
              rv32-lower) package_args+=(-p thruput-rv32-lower) ;;
              thruput-faucet)
                package_args+=(-p thruput-faucet)
                features+=(thruput-faucet/heap-profiling)
                ;;
              hog-firehose-store|hog-firehose-serve)
                package_args+=(-p thruput-firehose) ;;
              *)
                echo "unsupported release app: $app" >&2
                exit 1
                ;;
            esac
          done
          if [ "${{ matrix.platform }}" = linux ] && [ "${#features[@]}" -gt 0 ]; then
            package_args+=(--features "$(IFS=,; echo "${features[*]}")")
          fi

          cargo build --locked --release "${package_args[@]}" --bins

          if [ "${{ matrix.platform }}" = linux ]; then
            for app in $RELEASE_APPS; do
              case "$app" in
                hog-gateway | thruput-faucet) want=1 ;;
                *) want=0 ;;
              esac
              have=0
              if grep -aq '<jemalloc>' "target/release/$app"; then have=1; fi
              if [ "$have" != "$want" ]; then
                echo "$app: jemalloc linked=$have, expected $want" >&2
                exit 1
              fi
            done
          fi

      - name: Verify macOS CLI portability
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail

          file target/release/thruput | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --strict --verbose=4 target/release/thruput

          unexpected_deps=$(
            otool -L target/release/thruput \
              | tail -n +2 \
              | awk '$1 !~ /^\/System\/Library\// && $1 !~ /^\/usr\/lib\// { print $1 }'
          )
          if [ -n "$unexpected_deps" ]; then
            echo "thruput has non-system macOS dependencies:" >&2
            echo "$unexpected_deps" >&2
            exit 1
          fi

      - name: Prepare and verify artifacts
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          mkdir -p artifacts package
          release_ref=${RELEASE_REF//\//-}

          for app in $RELEASE_APPS; do
            archive_base="${app}-${release_ref}-${{ matrix.release_target }}"
            package_dir="package/${archive_base}"
            archive="artifacts/${archive_base}.tar.gz"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            debug_root="package/${archive_base}-debuginfo"
            debug_archive="artifacts/${archive_base}-debuginfo.tar.gz"
            if [ "${{ matrix.platform }}" = linux ]; then
              bash scripts/split-release-debuginfo.sh "$package_dir/$app" "$debug_root" "$debug_archive"
            else
              bash scripts/split-release-dsym.sh "$package_dir/$app" "$debug_root" "$debug_archive"
            fi
            cp README.md LICENSE "$package_dir/"
            chmod +x "$package_dir/$app"
            tar -czf "$archive" -C package "$archive_base"

            verify_dir="verify/${archive_base}"
            mkdir -p "$verify_dir"
            tar -xzf "$archive" -C "$verify_dir"
            test -x "$verify_dir/$archive_base/$app"
            test -f "$verify_dir/$archive_base/README.md"
            test -f "$verify_dir/$archive_base/LICENSE"
            expected_version=${EXPECTED_BINARY_VERSION}
            if [ "$app" = thruput ] || [ "$app" = hog-gateway ]; then
              expected_version="$CRATE_VERSION (commit ${EXPECTED_SOURCE_COMMIT:0:8})"
            fi
            test "$("$verify_dir/$archive_base/$app" --version)" = "$app $expected_version"
          done

      # Explicit target keeps CI host features out of the artifact contract.
      # Runtime qualification belongs on a Zen 5 deployment host.
      - name: Build and package Zen 5 gateway
        if: matrix.platform == 'linux' && matrix.architecture == 'x86_64'
        env:
          RUSTFLAGS: "-C target-cpu=znver5 -C force-frame-pointers=yes -C link-arg=-Wl,--build-id=sha1"
          CARGO_TARGET_DIR: target/znver5
        run: |
          set -euo pipefail
          unset GROUNDHOG_DISTRIBUTION_VERSION
          export GROUNDHOG_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT"
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p thruput-json-rpc-gateway --bin hog-gateway --features heap-profiling
          grep -aq '<jemalloc>' target/znver5/x86_64-unknown-linux-gnu/release/hog-gateway
          release_ref=${RELEASE_REF//\//-}
          archive_base="hog-gateway-${release_ref}-x86_64-unknown-linux-gnu-znver5"
          mkdir -p "package/$archive_base"
          cp target/znver5/x86_64-unknown-linux-gnu/release/hog-gateway README.md LICENSE "package/$archive_base/"
          bash scripts/split-release-debuginfo.sh "package/$archive_base/hog-gateway" \
            "package/${archive_base}-debuginfo" "artifacts/${archive_base}-debuginfo.tar.gz"
          tar -czf "artifacts/$archive_base.tar.gz" -C package "$archive_base"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/*.tar.gz
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'namespace-profile-hogd-linux-2604' }}
    permissions:
      contents: read
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-x86_64-release-artifacts
          path: artifacts/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-arm64-release-artifacts
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-macos-arm64-release-artifacts
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 28
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Upload assembled release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: groundhog-rpc-release-artifacts
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor_id == '41898282' && github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: namespace-profile-hogd-linux-2604
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download assembled release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-release-artifacts
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          tag_name: ${{ inputs.release-ref }}
          draft: false
          prerelease: ${{ contains(inputs.release-ref, '-') }}
