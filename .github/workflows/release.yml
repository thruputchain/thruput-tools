name: Release

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
  RELEASE_TARGET: x86_64-unknown-linux-gnu
  RELEASE_CRATES: >-
    groundhog-cli
    groundhog-rv32-lower

permissions:
  contents: write

jobs:
  release:
    runs-on: namespace-profile-chuckd-rs-linux
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Verify publish-driven release
        run: |
          set -euo pipefail

          if [ "${GITHUB_ACTOR}" != "github-actions[bot]" ]; then
            echo "release.yml is internal; run the Release package workflow instead."
            echo "Unexpected actor: ${GITHUB_ACTOR}"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release.yml must be dispatched on a release tag ref, got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          for crate in $RELEASE_CRATES; do
            cargo info "${crate}@${VERSION}" --registry groundhog >/dev/null
            echo "OK: ${crate}@${VERSION} exists in the groundhog registry"
          done

      - name: Build hog-gateway
        run: cargo build --locked --release -p groundhog-json-rpc-gateway --bin hog-gateway

      - name: Build groundhog CLI
        run: cargo build --locked --release -p groundhog-cli --bin groundhog --features dev-node

      - name: Build rv32-lower
        run: cargo build --locked --release -p groundhog-rv32-lower --bin rv32-lower

      - name: Verify hog-gateway
        run: target/release/hog-gateway --help

      - name: Verify groundhog CLI
        run: target/release/groundhog --help

      - name: Verify rv32-lower
        run: target/release/rv32-lower --help

      - name: Prepare artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts package

          for app in hog-gateway groundhog rv32-lower; do
            archive_base="${app}-${GITHUB_REF_NAME}-${RELEASE_TARGET}"
            package_dir="package/${archive_base}"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            chmod +x "$package_dir/$app"
            tar -czf "artifacts/${archive_base}.tar.gz" -C package "$archive_base"
          done

          cd artifacts
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
