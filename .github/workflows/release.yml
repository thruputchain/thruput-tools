name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
  PLATFORM_RELEASE_VERSION: "0.1.23"
  RELEASE_CRATES: >-
    groundhog-cli
    groundhog-rv32-lower

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            machine: x86_64
            platform: linux
            release_target: x86_64-unknown-linux-gnu
            runner: namespace-profile-chuckd-rs-linux
            artifact_name: groundhog-rpc-x86_64-release-artifacts
            release_apps: hog-gateway groundhog rv32-lower hogsim groundhog-faucet
          - architecture: arm64
            machine: aarch64
            platform: linux
            release_target: aarch64-unknown-linux-gnu
            runner: namespace-profile-hogd-linux-arm64
            artifact_name: groundhog-rpc-arm64-release-artifacts
            release_apps: hog-gateway groundhog rv32-lower hogsim groundhog-faucet
          - architecture: arm64
            machine: arm64
            platform: macos
            release_target: aarch64-apple-darwin
            runner: namespace-profile-hogd-arm64-macos
            artifact_name: groundhog-rpc-macos-arm64-release-artifacts
            release_apps: groundhog
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0

      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Read crate version
        run: |
          crate_id=$(cargo pkgid --locked -p groundhog-cli)
          crate_version=${crate_id##*[@#]}
          test -n "$crate_version"
          if [ -z "$PLATFORM_RELEASE_VERSION" ]; then
            echo "PLATFORM_RELEASE_VERSION must not be empty"
            exit 1
          fi
          echo "CRATE_VERSION=$crate_version" >> "$GITHUB_ENV"

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Verify publish-driven release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ "${GITHUB_ACTOR}" != "github-actions[bot]" ]; then
            echo "release.yml is internal; run the Release package workflow instead."
            echo "Unexpected actor: ${GITHUB_ACTOR}"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release.yml must be dispatched on a release tag ref, got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$CRATE_VERSION" != "$VERSION" ]; then
            echo "Release tag version $VERSION does not match workspace crate version $CRATE_VERSION"
            exit 1
          fi
          for crate in $RELEASE_CRATES; do
            cargo info "${crate}@${VERSION}" --registry groundhog >/dev/null
            echo "OK: ${crate}@${VERSION} exists in the groundhog registry"
          done

      - name: Verify platform-release version wiring
        if: github.event_name == 'pull_request' && matrix.architecture == 'x86_64'
        run: |
          export GROUNDHOG_DISTRIBUTION_VERSION="$PLATFORM_RELEASE_VERSION"
          cargo build --locked --release \
            -p groundhog-json-rpc-gateway \
            -p groundhog-cli \
            -p groundhog-rv32-lower \
            -p groundhog-sim \
            -p groundhog-faucet \
            --bins

          expected_version="$CRATE_VERSION (platform $PLATFORM_RELEASE_VERSION)"
          for app in hog-gateway groundhog rv32-lower hogsim groundhog-faucet; do
            test "$(target/release/$app --version)" = "$app $expected_version"
          done

      - name: Build release binaries
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          expected_version="$CRATE_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A runner-inherited value must not label ordinary PR artifacts as platform releases.
            unset GROUNDHOG_DISTRIBUTION_VERSION
          else
            export GROUNDHOG_DISTRIBUTION_VERSION="$PLATFORM_RELEASE_VERSION"
            expected_version="$expected_version (platform $PLATFORM_RELEASE_VERSION)"
          fi
          echo "EXPECTED_BINARY_VERSION=$expected_version" >> "$GITHUB_ENV"

          package_args=()
          for app in $RELEASE_APPS; do
            case "$app" in
              hog-gateway) package_args+=(-p groundhog-json-rpc-gateway) ;;
              groundhog) package_args+=(-p groundhog-cli) ;;
              rv32-lower) package_args+=(-p groundhog-rv32-lower) ;;
              hogsim) package_args+=(-p groundhog-sim) ;;
              groundhog-faucet) package_args+=(-p groundhog-faucet) ;;
              *)
                echo "unsupported release app: $app" >&2
                exit 1
                ;;
            esac
          done

          cargo build --locked --release "${package_args[@]}" --bins

      - name: Verify hog-gateway
        if: matrix.platform == 'linux'
        run: test "$(target/release/hog-gateway --version)" = "hog-gateway ${EXPECTED_BINARY_VERSION}"

      - name: Verify groundhog CLI
        run: test "$(target/release/groundhog --version)" = "groundhog ${EXPECTED_BINARY_VERSION}"

      - name: Verify macOS CLI portability
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail

          file target/release/groundhog | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --strict --verbose=4 target/release/groundhog

          unexpected_deps=$(
            otool -L target/release/groundhog \
              | tail -n +2 \
              | awk '$1 !~ /^\/System\/Library\// && $1 !~ /^\/usr\/lib\// { print $1 }'
          )
          if [ -n "$unexpected_deps" ]; then
            echo "groundhog has non-system macOS dependencies:" >&2
            echo "$unexpected_deps" >&2
            exit 1
          fi

      - name: Verify rv32-lower
        if: matrix.platform == 'linux'
        run: test "$(target/release/rv32-lower --version)" = "rv32-lower ${EXPECTED_BINARY_VERSION}"

      - name: Verify hogsim
        if: matrix.platform == 'linux'
        run: test "$(target/release/hogsim --version)" = "hogsim ${EXPECTED_BINARY_VERSION}"

      - name: Verify groundhog-faucet
        if: matrix.platform == 'linux'
        run: test "$(target/release/groundhog-faucet --version)" = "groundhog-faucet ${EXPECTED_BINARY_VERSION}"

      - name: Prepare artifacts
        env:
          RELEASE_APPS: ${{ matrix.release_apps }}
        run: |
          set -euo pipefail

          mkdir -p artifacts package
          release_ref=${GITHUB_REF_NAME//\//-}

          for app in $RELEASE_APPS; do
            archive_base="${app}-${release_ref}-${{ matrix.release_target }}"
            package_dir="package/${archive_base}"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            chmod +x "$package_dir/$app"
            tar -czf "artifacts/${archive_base}.tar.gz" -C package "$archive_base"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*.tar.gz

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: write
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-x86_64-release-artifacts
          path: artifacts/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-arm64-release-artifacts
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-macos-arm64-release-artifacts
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 11
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
