name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://groundhog.dev/crates/api/v1/crates/
  HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
  GROUNDHOG_DISTRIBUTION_VERSION: "0.1.21"
  RELEASE_CRATES: >-
    groundhog-cli
    groundhog-rv32-lower

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            machine: x86_64
            release_target: x86_64-unknown-linux-gnu
            runner: namespace-profile-chuckd-rs-linux
          - architecture: arm64
            machine: aarch64
            release_target: aarch64-unknown-linux-gnu
            runner: namespace-profile-hogd-linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Verify native Linux architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Verify publish-driven release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ "${GITHUB_ACTOR}" != "github-actions[bot]" ]; then
            echo "release.yml is internal; run the Release package workflow instead."
            echo "Unexpected actor: ${GITHUB_ACTOR}"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release.yml must be dispatched on a release tag ref, got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          for crate in $RELEASE_CRATES; do
            cargo info "${crate}@${VERSION}" --registry groundhog >/dev/null
            echo "OK: ${crate}@${VERSION} exists in the groundhog registry"
          done

      - name: Build hog-gateway
        run: cargo build --locked --release -p groundhog-json-rpc-gateway --bin hog-gateway

      - name: Build groundhog CLI
        run: cargo build --locked --release -p groundhog-cli --bin groundhog

      - name: Build rv32-lower
        run: cargo build --locked --release -p groundhog-rv32-lower --bin rv32-lower

      - name: Build hogsim
        run: cargo build --locked --release -p groundhog-sim --bin hogsim

      - name: Build groundhog-faucet
        run: cargo build --locked --release -p groundhog-faucet --bin groundhog-faucet

      - name: Verify hog-gateway
        run: test "$(target/release/hog-gateway --version)" = "hog-gateway ${GROUNDHOG_DISTRIBUTION_VERSION}"

      - name: Verify groundhog CLI
        run: test "$(target/release/groundhog --version)" = "groundhog ${GROUNDHOG_DISTRIBUTION_VERSION}"

      - name: Verify rv32-lower
        run: test "$(target/release/rv32-lower --version)" = "rv32-lower ${GROUNDHOG_DISTRIBUTION_VERSION}"

      - name: Verify hogsim
        run: test "$(target/release/hogsim --version)" = "hogsim ${GROUNDHOG_DISTRIBUTION_VERSION}"

      - name: Verify groundhog-faucet
        run: test "$(target/release/groundhog-faucet --version)" = "groundhog-faucet ${GROUNDHOG_DISTRIBUTION_VERSION}"

      - name: Prepare artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts package
          release_ref=${GITHUB_REF_NAME//\//-}

          for app in hog-gateway groundhog rv32-lower hogsim groundhog-faucet; do
            archive_base="${app}-${release_ref}-${{ matrix.release_target }}"
            package_dir="package/${archive_base}"
            mkdir -p "$package_dir"
            cp "target/release/${app}" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            chmod +x "$package_dir/$app"
            tar -czf "artifacts/${archive_base}.tar.gz" -C package "$archive_base"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: groundhog-rpc-${{ matrix.architecture }}-release-artifacts
          path: artifacts/*.tar.gz

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      contents: write
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-x86_64-release-artifacts
          path: artifacts/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: groundhog-rpc-arm64-release-artifacts
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 10
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
