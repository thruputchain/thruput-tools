name: CLI terminal UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/tools/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cli-ui.yml'

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/

jobs:
  macos-terminal:
    name: macOS terminal smoke
    runs-on: namespace-profile-hogd-arm64-macos
    timeout-minutes: 30
    steps:
      - uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Shared components and terminal lifecycles
        run: |
          cargo test --locked -p groundhog-cli --lib print::
          cargo test --locked -p groundhog-cli --test progress_ui_test --test listing_ui_test
      - name: Command and service output audit
        run: cargo test --locked -p groundhog-cli --test cli_integration_test ui_audit
