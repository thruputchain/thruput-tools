# zizmor configuration. https://docs.zizmor.sh/configuration/
#
# `unpinned-uses` default: hash-pinning policy for every action

rules:
  # HIGH severity, and the one worth fixing first: publish.yml interpolates
  # ${{ github.actor }} straight into a run block, and writes ${{ github.token }}
  # into the git remote URL (persisting it in .git/config).
  template-injection:
    ignore:
      - publish.yml

  # Checkout steps that do not set `persist-credentials: false`.
  artipacked:
    ignore:
      - publish.yml
      - publish_dry_run.yml

  # Job runs with default (write) permissions.
  excessive-permissions:
    ignore:
      - publish_dry_run.yml

  # Style: prefers '$/...' over './...' for same-repo composite actions.
  self-repository:
    ignore:
      - publish.yml
      - publish_dry_run.yml

  # Informational: `gh release` could replace softprops/action-gh-release.
  superfluous-actions:
    ignore:
      - release.yml

  # These three read the referenced repository's refs over git. Our workflows
  # reference the private groundhogchain/actions, and a consumer's
  # github.token cannot read it, so they abort the whole run with 403 rather
  # than reporting findings. Everything else still runs in CI, including
  # unpinned-uses and known-vulnerable-actions.
  #
  # Run them locally with a token that can read that repo (see
  # rustsec/POLICY.md). Retire these once groundhogchain/actions is public.
  impostor-commit:
    disable: true
  stale-action-refs:
    disable: true
  ref-version-mismatch:
    disable: true
