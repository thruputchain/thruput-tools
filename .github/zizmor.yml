# zizmor exceptions
#
# https://docs.zizmor.sh/configuration/

rules:
  # Style: prefers '$/...' over './...' for same-repo composite actions,
  # but that offends actionlint.
  self-repository:
    ignore:
      - publish.yml
      - publish_dry_run.yml

  # Informational: `gh release` could replace softprops/action-gh-release.
  superfluous-actions:
    ignore:
      - release.yml

  # These checks must read referenced repos, and groundhogchain/actions is
  # private.
  impostor-commit:
    disable: true
  stale-action-refs:
    disable: true
  ref-version-mismatch:
    disable: true
